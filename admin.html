<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#FFFFFF">
<meta name="color-scheme" content="light only">
<title>ADAL · Админка</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 64 64%27%3E%3Crect width=%2764%27 height=%2764%27 rx=%2716%27 fill=%27%230F4C4A%27/%3E%3Cg transform=%27translate(9 13)%27%3E%3Cpath d=%27M3 34V17L14 7l11 10v17z%27 fill=%27%23fff%27/%3E%3Cpath d=%27M21 34V17l11-10 11 10v17z%27 fill=%27%23E9A23B%27/%3E%3C/g%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@700&family=Manrope:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: одна колонка до 760px — шапка, панель фильтров, список товаров строками; редактирование в нижней шторке */
:root{
  --bg:#F4F6F5; --surface:#FFFFFF; --ink:#0E2B2C; --muted:#5D7273; --line:#E2E9E7;
  --brand:#0F4C4A; --brand-ink:#FFFFFF; --accent:#E9A23B; --accent-soft:#FBEBD2;
  --ok:#2E8B57; --ok-soft:#DDF1E5; --warn:#B7701A; --bad:#C0473A; --bad-soft:#F8E1DE;
  --shadow:0 1px 2px rgba(14,43,44,.06),0 4px 14px rgba(14,43,44,.06);
  --font-logo:"Unbounded","Manrope",system-ui,sans-serif;
  --font-body:"Manrope",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:light;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:15px;line-height:1.45}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.wrap{max-width:760px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2{margin:0;font-weight:800;letter-spacing:-.02em;text-wrap:balance}
h1{font-size:24px} h2{font-size:19px}
.muted{color:var(--muted)}

body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:color-mix(in srgb,var(--surface) 94%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:12px}
.logo{display:flex;align-items:center;gap:9px;font-family:var(--font-logo);font-weight:700;font-size:21px;line-height:1}
.logo small{font-family:var(--font-body);font-weight:700;font-size:12px;letter-spacing:.06em;text-transform:uppercase;background:var(--accent-soft);color:var(--warn);padding:4px 8px;border-radius:8px;margin-left:4px}
.top-actions{display:flex;gap:8px}
.ghost{border:0;background:var(--bg);border-radius:12px;padding:8px 11px;font-weight:700;font-size:13px;color:var(--ink);text-decoration:none;white-space:nowrap}
.top-actions{gap:6px}
@media (max-width:420px){.logo small{display:none}}

.main{display:flex;flex-direction:column;gap:14px;padding-block:18px 60px}
.btn{border:0;border-radius:14px;padding:11px 16px;font-weight:800;background:var(--brand);color:var(--brand-ink)}
.btn.block{width:100%;padding:15px;font-size:16px;border-radius:16px}
.btn.light{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.btn.danger{background:var(--bad-soft);color:var(--bad)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.panel{background:var(--surface);border-radius:18px;box-shadow:var(--shadow);padding:16px;display:flex;flex-direction:column;gap:12px}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field label{font-size:13px;font-weight:700}
.field input,.field select{border:1.5px solid transparent;background:var(--bg);border-radius:12px;padding:12px;width:100%;min-width:0}
.field input:focus,.field select:focus{border-color:var(--brand);outline:none}
.field .hint{font-size:12px;color:var(--muted)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.err{background:var(--bad-soft);color:var(--bad);border-radius:12px;padding:10px 12px;font-size:13px;font-weight:700;margin:0}

.login{max-width:420px;margin:8vh auto 0}
.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.search{flex:1;min-width:180px;display:flex;align-items:center;gap:8px;background:var(--surface);box-shadow:var(--shadow);border-radius:14px;padding:0 12px}
.search input{border:0;background:transparent;padding:11px 0;width:100%;outline:none}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding:2px}
.chip{flex:none;border:0;background:var(--surface);box-shadow:var(--shadow);border-radius:999px;padding:8px 14px;font-weight:700;font-size:13px}
.chip[aria-pressed="true"]{background:var(--ink);color:#fff}
.summary{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat{background:var(--surface);box-shadow:var(--shadow);border-radius:16px;padding:12px}
.stat b{display:block;font-size:20px;font-weight:800;font-variant-numeric:tabular-nums}
.stat span{font-size:12px;color:var(--muted);font-weight:600}

.list{display:flex;flex-direction:column;gap:10px}
.row{background:var(--surface);box-shadow:var(--shadow);border-radius:18px;padding:10px;display:grid;grid-template-columns:64px minmax(0,1fr) auto;gap:12px;align-items:center}
.row.off{opacity:.6}
.thumb{width:64px;height:76px;border-radius:12px;overflow:hidden;position:relative;background:linear-gradient(150deg,var(--c1,#0F4C4A),var(--c2,#0A3534))}
.thumb img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;background:#F3F5F4}
.info{min-width:0;display:flex;flex-direction:column;gap:2px}
.info .nm{font-weight:800;font-size:14px;line-height:1.25;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.info .meta{font-size:12.5px;color:var(--muted);font-weight:600}
.tag{display:inline-block;font-size:11px;font-weight:800;padding:2px 7px;border-radius:999px;background:var(--bg);color:var(--muted)}
.tag.off{background:var(--bad-soft);color:var(--bad)}
.side{display:flex;flex-direction:column;align-items:flex-end;gap:8px}
.price-in{display:flex;align-items:center;background:var(--bg);border-radius:12px;border:1.5px solid transparent;width:118px}
.price-in:focus-within{border-color:var(--brand)}
.price-in input{border:0;background:transparent;width:100%;padding:9px 0 9px 10px;font-weight:800;font-size:16px;text-align:right;font-variant-numeric:tabular-nums;outline:none;min-width:0}
.price-in em{font-style:normal;color:var(--muted);font-weight:700;padding:0 10px 0 4px}
.price-in.saved{border-color:var(--ok)}
.row-actions{display:flex;gap:6px}
.icon{width:36px;height:36px;border:0;border-radius:10px;background:var(--bg);display:flex;align-items:center;justify-content:center}
.icon svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}

.switch{position:relative;display:inline-flex;align-items:center;gap:10px;font-weight:700;font-size:14px;cursor:pointer}
.switch input{position:absolute;opacity:0;width:1px;height:1px}
.switch .tr{width:46px;height:28px;border-radius:999px;background:#C9D3D1;position:relative;transition:background .15s;flex:none}
.switch .tr::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.2);transition:transform .15s}
.switch input:checked+.tr{background:var(--ok)}
.switch input:checked+.tr::after{transform:translateX(18px)}
.switch input:focus-visible+.tr{outline:3px solid var(--accent);outline-offset:2px}

.sheet-bg{position:fixed;inset:0;background:rgba(9,24,24,.45);z-index:30;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:22px 22px 0 0;padding:20px max(16px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:14px}
.sheet-head{display:flex;justify-content:space-between;align-items:center;gap:10px}
.photo-edit{display:grid;grid-template-columns:120px 1fr;gap:14px;align-items:center}
.photo-edit .thumb{width:120px;height:144px;border-radius:16px}
.photo-edit .acts{display:flex;flex-direction:column;gap:8px;align-items:flex-start}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:#fff;padding:11px 16px;border-radius:14px;font-weight:700;font-size:14px;z-index:40;max-width:calc(100% - 32px)}
.empty{text-align:center;padding:36px 16px;color:var(--muted)}
@media (max-width:520px){
  .row{grid-template-columns:56px minmax(0,1fr);grid-template-areas:"t i" "s s"}
  .row .thumb{grid-area:t;width:56px;height:68px}
  .row .info{grid-area:i}
  .row .side{grid-area:s;flex-direction:row;justify-content:space-between;align-items:center}
  .summary{grid-template-columns:repeat(3,1fr)}
  .stat b{font-size:17px}
}
@media (prefers-reduced-motion:reduce){.switch .tr,.switch .tr::after{transition:none}}
</style>
</head>
<body>

<header class="top">
  <div class="wrap">
    <div class="logo"><svg width="30" height="23" viewBox="0 0 46 36" aria-hidden="true"><path d="M3 34 V17 L14 7 L25 17 V34 Z" fill="#0F4C4A"/><path d="M21 34 V17 L32 7 L43 17 V34 Z" fill="#E9A23B"/></svg>adal<small>админ</small></div>
    <div class="top-actions" id="topActions" hidden>
      <a class="ghost" href="./" target="_blank" rel="noopener">Сайт</a>
      <button class="ghost" data-act="settings">Пароль</button>
      <button class="ghost" data-act="logout">Выйти</button>
    </div>
  </div>
</header>

<main class="wrap main" id="view"></main>

<script>
const SB_URL = "https://fakhibznbnfycafgvfiw.supabase.co";
const SB_KEY = "sb_publishable_CtZFCSLjUTde5NRtGizYyQ_nSJ7LQU2";
const UPLOAD_URL = SB_URL + "/functions/v1/adal-admin-upload";
const CATS = {clean:"Чистящие средства", soap:"Мыло", dish:"Для посуды", wash:"Для стирки"};

async function rpc(fn, args){
  const res = await fetch(SB_URL + "/rest/v1/rpc/" + fn, {method:"POST", headers:{"apikey":SB_KEY,"Content-Type":"application/json"}, body:JSON.stringify(args)});
  const data = await res.json().catch(()=>null);
  if(!res.ok) throw new Error((data && data.message) || "Ошибка сети");
  if(data && data.error) throw new Error(data.error);
  return data;
}
const store = {
  get(){ try{ return sessionStorage.getItem("adal-admin"); }catch(_){ return null; } },
  set(v){ try{ sessionStorage.setItem("adal-admin", v); }catch(_){} },
  del(){ try{ sessionStorage.removeItem("adal-admin"); }catch(_){} }
};

const state = { pass: store.get(), products: [], q:"", filter:"all", busy:false, loading:false };
const $ = s => document.querySelector(s);
const esc = s => String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmt = n => Math.round(n).toLocaleString("ru-RU").replace(/ |,/g," ") + " ₸";
const imgOf = p => p.image_url || `img/${p.id}.jpg`;
function toast(msg){ const t=document.createElement("div"); t.className="toast"; t.setAttribute("role","status"); t.textContent=msg; document.body.appendChild(t); setTimeout(()=>t.remove(),2600); }

/* ---------- views ---------- */
function viewLogin(err){
  $("#topActions").hidden = true;
  $("#view").innerHTML = `<form class="panel login" id="loginForm" novalidate>
    <h1>Вход в админку</h1>
    <p class="muted" style="margin:0">Управление товарами и ценами ADAL market.</p>
    <div class="field"><label for="pw">Пароль администратора</label><input id="pw" type="password" autocomplete="current-password" required></div>
    ${err?`<p class="err">${esc(err)}</p>`:""}
    <button class="btn block" type="submit" ${state.busy?"disabled":""}>${state.busy?"Проверяем…":"Войти"}</button>
  </form>`;
  $("#pw").focus();
}

function visible(){
  const q = state.q.trim().toLowerCase();
  return state.products.filter(p =>
    (state.filter==="all" || (state.filter==="on" ? p.active : !p.active)) &&
    (!q || [p.brand,p.name,p.variant,p.weight].join(" ").toLowerCase().includes(q)));
}

function rowHtml(p){
  return `<div class="row ${p.active?"":"off"}" data-id="${p.id}">
    <div class="thumb" style="--c1:${esc(p.color||"#0F4C4A")};--c2:${esc(p.color2||"#0A3534")}"><img src="${esc(imgOf(p))}" alt="" loading="lazy" onerror="this.remove()"></div>
    <div class="info">
      <div class="nm">${esc(p.name)}</div>
      <div class="meta">${esc([p.variant,p.weight].filter(Boolean).join(" · "))}</div>
      <div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:2px">
        <span class="tag">${esc(CATS[p.cat]||p.cat)}</span>
        ${p.active?"":`<span class="tag off">Скрыт</span>`}
        ${p.sold30?`<span class="tag">Продано за 30 дн.: ${p.sold30}</span>`:""}
      </div>
    </div>
    <div class="side">
      <label class="price-in" title="Цена на сайте"><input data-price="${p.id}" inputmode="numeric" value="${p.price}" aria-label="Цена ${esc(p.name)}"><em>₸</em></label>
      <div class="row-actions">
        <button class="icon" data-move="${p.id}" data-dir="-1" aria-label="Выше в каталоге"><svg viewBox="0 0 24 24"><path d="M6 15l6-6 6 6"/></svg></button>
        <button class="icon" data-move="${p.id}" data-dir="1" aria-label="Ниже в каталоге"><svg viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg></button>
        <button class="icon" data-edit="${p.id}" aria-label="Изменить"><svg viewBox="0 0 24 24"><path d="M4 20h4L19 9l-4-4L4 16v4zM13.5 6.5l4 4"/></svg></button>
      </div>
    </div>
  </div>`;
}

function viewList(){
  $("#topActions").hidden = false;
  const list = visible();
  const on = state.products.filter(p=>p.active).length;
  const sold = state.products.reduce((s,p)=>s+(+p.sold30||0),0);
  $("#view").innerHTML = `
    <div style="display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap">
      <div><h1>Товары и цены</h1><p class="muted" style="margin:4px 0 0">Цена сохраняется, когда вы уходите из поля или нажимаете Enter.</p></div>
      <button class="btn" data-act="new">+ Новый товар</button>
    </div>
    <div class="summary">
      <div class="stat"><b>${state.products.length}</b><span>всего товаров</span></div>
      <div class="stat"><b>${on}</b><span>на витрине</span></div>
      <div class="stat"><b>${sold}</b><span>шт. продано за 30 дней</span></div>
    </div>
    <div class="toolbar">
      <label class="search"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg><input id="q" placeholder="Найти товар" value="${esc(state.q)}" aria-label="Поиск"></label>
      <div class="chips" role="group" aria-label="Фильтр">
        ${[["all","Все"],["on","На витрине"],["off","Скрытые"]].map(([k,v])=>`<button class="chip" data-filter="${k}" aria-pressed="${state.filter===k}">${v}</button>`).join("")}
      </div>
    </div>
    <div class="list" id="list">${list.length ? list.map(rowHtml).join("") : `<div class="empty">${state.loading?"Загружаем…":"Ничего не найдено"}</div>`}</div>`;
}

function openEditor(p){
  const isNew = !p;
  p = p || {id:null, cat:"clean", brand:"", name:"", variant:"", weight:"1 шт", price:"", old_price:"", active:true};
  const bg = document.createElement("div"); bg.className="sheet-bg";
  bg.innerHTML = `<form class="sheet" id="editForm" role="dialog" aria-label="${isNew?"Новый товар":"Изменить товар"}" novalidate>
    <div class="sheet-head"><h2>${isNew?"Новый товар":"Изменить товар"}</h2><button type="button" class="ghost" data-close>Закрыть</button></div>
    <div class="photo-edit">
      <div class="thumb" id="ePhoto" style="--c1:${esc(p.color||"#0F4C4A")};--c2:${esc(p.color2||"#0A3534")}">${p.id?`<img src="${esc(imgOf(p))}" alt="" onerror="this.remove()">`:""}</div>
      <div class="acts">
        <input type="file" id="eFile" accept="image/jpeg,image/png,image/webp" hidden>
        <button type="button" class="btn light" id="ePick" ${p.id?"":"disabled"}>${p.id?"Загрузить фото":"Фото — после сохранения"}</button>
        <span class="muted" style="font-size:12.5px">Лучше вертикальное фото на светлом фоне. Мы сожмём его автоматически.</span>
      </div>
    </div>
    <div class="two">
      <div class="field"><label for="eBrand">Бренд</label><input id="eBrand" maxlength="40" value="${esc(p.brand)}" placeholder="ERA"></div>
      <div class="field"><label for="eCat">Категория</label><select id="eCat">${Object.entries(CATS).map(([k,v])=>`<option value="${k}" ${p.cat===k?"selected":""}>${v}</option>`).join("")}</select></div>
    </div>
    <div class="field"><label for="eName">Название</label><input id="eName" maxlength="120" value="${esc(p.name)}" placeholder="Средство для посуды ERA"></div>
    <div class="two">
      <div class="field"><label for="eVariant">Вкус или вариант</label><input id="eVariant" maxlength="60" value="${esc(p.variant)}" placeholder="Лимон и мята"></div>
      <div class="field"><label for="eWeight">Объём / вес</label><input id="eWeight" maxlength="20" value="${esc(p.weight)}" placeholder="1 л"></div>
    </div>
    <div class="two">
      <div class="field"><label for="ePrice">Цена на сайте, ₸</label><input id="ePrice" inputmode="numeric" value="${esc(p.price)}" placeholder="1200"></div>
      <div class="field"><label for="eOld">Цена в магазине, ₸</label><input id="eOld" inputmode="numeric" value="${esc(p.old_price??"")}" placeholder="необязательно"><span class="hint">Если заполнить, на сайте появится скидка «−%».</span></div>
    </div>
    <label class="switch"><input type="checkbox" id="eActive" ${p.active?"checked":""}><span class="tr"></span>Показывать на сайте</label>
    <p class="err" id="eErr" hidden></p>
    <button class="btn block" type="submit">${isNew?"Создать товар":"Сохранить"}</button>
  </form>`;
  document.body.appendChild(bg);
  const close = () => bg.remove();
  bg.addEventListener("click", e => { if(e.target===bg || e.target.closest("[data-close]")) close(); });
  bg.addEventListener("keydown", e => { if(e.key==="Escape") close(); });
  (isNew ? bg.querySelector("#eName") : bg.querySelector("#ePrice")).focus();

  const pick = bg.querySelector("#ePick"), file = bg.querySelector("#eFile");
  pick.addEventListener("click", () => file.click());
  file.addEventListener("change", async () => {
    const f = file.files[0]; if(!f) return;
    pick.disabled = true; pick.textContent = "Загружаем…";
    try{
      const data = await shrink(f);
      const res = await fetch(UPLOAD_URL, {method:"POST", headers:{"Content-Type":"application/json","apikey":SB_KEY}, body:JSON.stringify({pass:state.pass, id:p.id, data})});
      const out = await res.json().catch(()=>({error:"Ошибка сети"}));
      if(!res.ok || out.error) throw new Error(out.error || "Не удалось загрузить фото");
      p.image_url = out.url;
      const tp = state.products.find(x=>x.id===p.id); if(tp) tp.image_url = out.url;
      bg.querySelector("#ePhoto").innerHTML = `<img src="${esc(out.url)}" alt="">`;
      toast("Фото загружено");
      viewList();
    }catch(ex){ toast(ex.message); }
    pick.disabled = false; pick.textContent = "Загрузить другое фото"; file.value = "";
  });

  bg.querySelector("#editForm").addEventListener("submit", async e => {
    e.preventDefault();
    const err = bg.querySelector("#eErr"); err.hidden = true;
    const body = { id:p.id, cat:bg.querySelector("#eCat").value, brand:bg.querySelector("#eBrand").value, name:bg.querySelector("#eName").value,
      variant:bg.querySelector("#eVariant").value, weight:bg.querySelector("#eWeight").value,
      price:bg.querySelector("#ePrice").value.replace(/\D/g,""), old_price:bg.querySelector("#eOld").value.replace(/\D/g,""),
      active:bg.querySelector("#eActive").checked };
    const btn = e.submitter || bg.querySelector("button[type=submit]"); btn.disabled = true;
    try{
      const r = await rpc("adal_admin_save_product", {p_pass:state.pass, p:body});
      await load();
      if(isNew){
        toast("Товар создан. Теперь можно загрузить фото.");
        close(); openEditor(state.products.find(x=>x.id===r.id));
      } else { toast("Сохранено"); close(); }
    }catch(ex){ err.textContent = ex.message; err.hidden = false; btn.disabled = false; }
  });
}

/* сжатие фото в браузере: максимум 1000 px по длинной стороне, JPEG */
function shrink(file){
  return new Promise((resolve, reject) => {
    const url = URL.createObjectURL(file), img = new Image();
    img.onload = () => {
      const k = Math.min(1, 1000 / Math.max(img.width, img.height));
      const c = document.createElement("canvas"); c.width = Math.round(img.width*k); c.height = Math.round(img.height*k);
      const g = c.getContext("2d"); g.fillStyle = "#F3F5F4"; g.fillRect(0,0,c.width,c.height); g.drawImage(img,0,0,c.width,c.height);
      URL.revokeObjectURL(url); resolve(c.toDataURL("image/jpeg", 0.85));
    };
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error("Не удалось прочитать картинку")); };
    img.src = url;
  });
}

/* ---------- data ---------- */
async function load(){
  state.loading = true;
  try{
    const d = await rpc("adal_admin_products", {p_pass:state.pass});
    state.products = d.products;
  }catch(ex){
    if(/пароль|попыток/i.test(ex.message)){ state.pass=null; store.del(); viewLogin(ex.message); state.loading=false; return false; }
    toast(ex.message);
  }
  state.loading = false; viewList(); return true;
}

async function savePrice(input){
  const id = +input.dataset.price, p = state.products.find(x=>x.id===id);
  const v = input.value.replace(/\D/g,"");
  if(!p || String(p.price) === v) { input.value = p?.price ?? v; return; }
  if(!v || +v < 1){ toast("Цена должна быть больше нуля"); input.value = p.price; return; }
  try{
    await rpc("adal_admin_save_product", {p_pass:state.pass, p:{...p, price:v, old_price:p.old_price??""}});
    p.price = +v; input.value = v;
    const box = input.closest(".price-in"); box.classList.add("saved"); setTimeout(()=>box.classList.remove("saved"),1200);
    toast(`Цена обновлена: ${fmt(+v)}`);
  }catch(ex){ toast(ex.message); input.value = p.price; }
}

/* ---------- events ---------- */
document.addEventListener("submit", async e => {
  if(e.target.id !== "loginForm") return;
  e.preventDefault();
  const pw = $("#pw").value; if(!pw) return viewLogin("Введите пароль");
  state.busy = true; viewLogin();
  state.pass = pw;
  try{
    const d = await rpc("adal_admin_products", {p_pass:pw});
    state.products = d.products; store.set(pw); state.busy = false; viewList();
  }catch(ex){ state.pass = null; state.busy = false; viewLogin(ex.message); }
});

document.addEventListener("click", async e => {
  const b = e.target.closest("button"); if(!b) return;
  if(b.dataset.filter){ state.filter = b.dataset.filter; viewList(); return; }
  if(b.dataset.edit){ openEditor(state.products.find(x=>x.id===+b.dataset.edit)); return; }
  if(b.dataset.move){
    b.disabled = true;
    try{ await rpc("adal_admin_move", {p_pass:state.pass, p_id:+b.dataset.move, p_dir:+b.dataset.dir}); await load(); }
    catch(ex){ toast(ex.message); b.disabled = false; }
    return;
  }
  if(b.dataset.act==="new"){ openEditor(null); return; }
  if(b.dataset.act==="logout"){ state.pass=null; store.del(); viewLogin(); return; }
  if(b.dataset.act==="settings"){ openPassword(); return; }
});

document.addEventListener("input", e => {
  if(e.target.id === "q"){ state.q = e.target.value; const pos = e.target.selectionStart; viewList(); const q=$("#q"); q.focus(); q.setSelectionRange(pos,pos); }
});
document.addEventListener("keydown", e => {
  if(e.key === "Enter" && e.target.dataset && e.target.dataset.price){ e.preventDefault(); e.target.blur(); }
});
document.addEventListener("focusout", e => { if(e.target.dataset && e.target.dataset.price) savePrice(e.target); });

function openPassword(){
  const bg = document.createElement("div"); bg.className="sheet-bg";
  bg.innerHTML = `<form class="sheet" id="pwForm" role="dialog" aria-label="Смена пароля" novalidate>
    <div class="sheet-head"><h2>Смена пароля</h2><button type="button" class="ghost" data-close>Закрыть</button></div>
    <div class="field"><label for="np1">Новый пароль</label><input id="np1" type="password" autocomplete="new-password" minlength="8"></div>
    <div class="field"><label for="np2">Повторите пароль</label><input id="np2" type="password" autocomplete="new-password" minlength="8"><span class="hint">Не короче 8 символов.</span></div>
    <p class="err" id="pwErr" hidden></p>
    <button class="btn block" type="submit">Сменить пароль</button></form>`;
  document.body.appendChild(bg);
  bg.addEventListener("click", e => { if(e.target===bg || e.target.closest("[data-close]")) bg.remove(); });
  bg.querySelector("#np1").focus();
  bg.querySelector("#pwForm").addEventListener("submit", async e => {
    e.preventDefault();
    const a = bg.querySelector("#np1").value, b2 = bg.querySelector("#np2").value, er = bg.querySelector("#pwErr");
    if(a.length < 8){ er.textContent="Пароль должен быть не короче 8 символов"; er.hidden=false; return; }
    if(a !== b2){ er.textContent="Пароли не совпадают"; er.hidden=false; return; }
    try{ await rpc("adal_admin_change_password", {p_pass:state.pass, p_new:a}); state.pass=a; store.set(a); bg.remove(); toast("Пароль изменён"); }
    catch(ex){ er.textContent=ex.message; er.hidden=false; }
  });
}

if(state.pass){ load(); } else { viewLogin(); }
</script>
