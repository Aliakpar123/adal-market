<style>
/* Layout: одна колонка до 760px — шапка, панель фильтров, список товаров строками; редактирование в нижней шторке */
:root{
  --bg:#F4F6F5; --surface:#FFFFFF; --ink:#0E2B2C; --muted:#5D7273; --line:#E2E9E7;
  --brand:#0F4C4A; --brand-ink:#FFFFFF; --accent:#E9A23B; --accent-soft:#FBEBD2;
  --ok:#2E8B57; --ok-soft:#DDF1E5; --warn:#B7701A; --bad:#C0473A; --bad-soft:#F8E1DE;
  --shadow:0 1px 2px rgba(14,43,44,.06),0 4px 14px rgba(14,43,44,.06);
  --font-logo:"Unbounded","Onest",system-ui,sans-serif;
  --font-body:"Onest",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:light;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:15px;line-height:1.45}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.wrap{max-width:1040px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2{margin:0;font-weight:800;letter-spacing:-.02em;text-wrap:balance}
h1{font-size:24px} h2{font-size:19px}
.muted{color:var(--muted)}

body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:color-mix(in srgb,var(--surface) 94%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:12px}
.logo{display:flex;align-items:center;gap:9px;font-family:var(--font-logo);font-weight:700;font-size:21px;line-height:1}
.logo small{font-family:var(--font-body);font-weight:700;font-size:12px;letter-spacing:.06em;text-transform:uppercase;background:var(--accent-soft);color:var(--warn);padding:4px 8px;border-radius:8px;margin-left:4px}
.top-actions{display:flex;gap:8px}
.ghost{border:0;background:var(--bg);border-radius:12px;padding:8px 11px;font-weight:700;font-size:13px;color:var(--ink);text-decoration:none;white-space:nowrap}
.top-actions{gap:6px}
@media (max-width:420px){.logo small{display:none}}

.main{display:flex;flex-direction:column;gap:14px;padding-block:18px 60px}
.btn{border:0;border-radius:14px;padding:11px 16px;font-weight:800;background:var(--brand);color:var(--brand-ink)}
.btn.block{width:100%;padding:15px;font-size:16px;border-radius:16px}
.btn.light{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.btn.danger{background:var(--bad-soft);color:var(--bad)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.panel{background:var(--surface);border-radius:18px;box-shadow:var(--shadow);padding:16px;display:flex;flex-direction:column;gap:12px}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field label{font-size:13px;font-weight:700}
.field input,.field select{border:1.5px solid transparent;background:var(--bg);border-radius:12px;padding:12px;width:100%;min-width:0}
.field input:focus,.field select:focus{border-color:var(--brand);outline:none}
.field .hint{font-size:12px;color:var(--muted)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.err{background:var(--bad-soft);color:var(--bad);border-radius:12px;padding:10px 12px;font-size:13px;font-weight:700;margin:0}

.login{max-width:420px;margin:8vh auto 0}
.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.search{flex:1;min-width:180px;display:flex;align-items:center;gap:8px;background:var(--surface);box-shadow:var(--shadow);border-radius:14px;padding:0 12px}
.search input{border:0;background:transparent;padding:11px 0;width:100%;outline:none}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding:2px}
.chip{flex:none;border:0;background:var(--surface);box-shadow:var(--shadow);border-radius:999px;padding:8px 14px;font-weight:700;font-size:13px}
.chip[aria-pressed="true"]{background:var(--ink);color:#fff}
.summary{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat{background:var(--surface);box-shadow:var(--shadow);border-radius:16px;padding:12px}
.stat b{display:block;font-size:20px;font-weight:800;font-variant-numeric:tabular-nums}
.stat span{font-size:12px;color:var(--muted);font-weight:600}

.list{display:flex;flex-direction:column;gap:10px}
.row{background:var(--surface);box-shadow:var(--shadow);border-radius:18px;padding:10px;display:grid;grid-template-columns:64px minmax(0,1fr) auto;gap:12px;align-items:center}
.row.off{opacity:.6}
.thumb{width:64px;height:76px;border-radius:12px;overflow:hidden;position:relative;background:linear-gradient(150deg,var(--c1,#0F4C4A),var(--c2,#0A3534))}
.thumb img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;background:#F3F5F4}
.info{min-width:0;display:flex;flex-direction:column;gap:2px}
.info .nm{font-weight:800;font-size:14px;line-height:1.25;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.info .meta{font-size:12.5px;color:var(--muted);font-weight:600}
.tag{display:inline-block;font-size:11px;font-weight:800;padding:2px 7px;border-radius:999px;background:var(--bg);color:var(--muted)}
.tag.off{background:var(--bad-soft);color:var(--bad)}
.side{display:flex;flex-direction:column;align-items:flex-end;gap:8px}
.price-in{display:flex;align-items:center;background:var(--bg);border-radius:12px;border:1.5px solid transparent;width:118px}
.price-in:focus-within{border-color:var(--brand)}
.price-in input{border:0;background:transparent;width:100%;padding:9px 0 9px 10px;font-weight:800;font-size:16px;text-align:right;font-variant-numeric:tabular-nums;outline:none;min-width:0}
.price-in em{font-style:normal;color:var(--muted);font-weight:700;padding:0 10px 0 4px}
.price-in.saved{border-color:var(--ok)}
.row-actions{display:flex;gap:6px}
.icon{width:36px;height:36px;border:0;border-radius:10px;background:var(--bg);display:flex;align-items:center;justify-content:center}
.icon svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}

.switch{position:relative;display:inline-flex;align-items:center;gap:10px;font-weight:700;font-size:14px;cursor:pointer}
.switch input{position:absolute;opacity:0;width:1px;height:1px}
.switch .tr{width:46px;height:28px;border-radius:999px;background:#C9D3D1;position:relative;transition:background .15s;flex:none}
.switch .tr::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.2);transition:transform .15s}
.switch input:checked+.tr{background:var(--ok)}
.switch input:checked+.tr::after{transform:translateX(18px)}
.switch input:focus-visible+.tr{outline:3px solid var(--accent);outline-offset:2px}

.sheet-bg{position:fixed;inset:0;background:rgba(9,24,24,.45);z-index:30;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:22px 22px 0 0;padding:20px max(16px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:14px}
.sheet-head{display:flex;justify-content:space-between;align-items:center;gap:10px}
.photo-edit{display:grid;grid-template-columns:120px 1fr;gap:14px;align-items:center}
.photo-edit .thumb{width:120px;height:144px;border-radius:16px}
.photo-edit .acts{display:flex;flex-direction:column;gap:8px;align-items:flex-start}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:#fff;padding:11px 16px;border-radius:14px;font-weight:700;font-size:14px;z-index:40;max-width:calc(100% - 32px)}
.empty{text-align:center;padding:36px 16px;color:var(--muted)}
.calc{background:var(--bg);border-radius:16px;padding:12px 14px;display:flex;flex-direction:column;gap:2px;font-variant-numeric:tabular-nums}
.calc .cl{display:flex;justify-content:space-between;gap:10px;font-size:14px;padding:3px 0}
.calc .cl span:first-child{color:var(--muted);font-weight:600}
.calc .cl.res{border-top:1.5px solid var(--line);margin-top:6px;padding-top:9px;font-weight:800;font-size:17px}
.calc .cl.res span:first-child{color:var(--ink)}
.calc .good{color:var(--ok)} .calc .bad{color:var(--bad)}
.calc .rec{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:8px;background:var(--surface);border-radius:12px;padding:9px 10px 9px 12px;font-size:13.5px;font-weight:700}
.calc .rec button{border:0;background:var(--brand);color:#fff;border-radius:10px;padding:7px 11px;font-weight:800;font-size:13px}
.tag.profit{background:var(--ok-soft);color:var(--ok)} .tag.loss{background:var(--bad-soft);color:var(--bad)}
.price-in small{font-size:10.5px;font-weight:700;color:var(--muted);padding-left:10px;white-space:nowrap}
.inputs{display:flex;gap:6px}
.inputs .price-in{width:104px;flex-direction:column;align-items:stretch}
.inputs .price-in .r{display:flex;align-items:center}
.inputs .price-in input{padding:2px 0 7px 10px}
.plan-grid{display:grid;grid-template-columns:minmax(0,1fr);gap:14px}
@media (min-width:900px){.plan-grid{grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);align-items:start}}
.plan-out{display:flex;flex-direction:column;gap:14px}
.goal .mini{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:4px}
.goal .mini div{background:rgba(255,255,255,.12);border-radius:12px;padding:8px 10px}
.goal .mini b{display:block;font-size:18px;font-weight:800;font-variant-numeric:tabular-nums;white-space:nowrap}
.goal .mini span{font-size:11.5px;opacity:.8}
@media (min-width:900px){.goal .mini{display:none}}
.calc .cl>:last-child{white-space:nowrap}
.list,.toolbar,.summary{max-width:760px}
.goal{background:var(--brand);color:#fff;border-radius:22px;padding:18px;display:flex;flex-direction:column;gap:8px}
.goal label{font-weight:700;opacity:.85;font-size:14px}
.goal .gin{display:flex;align-items:baseline;gap:8px;background:rgba(255,255,255,.12);border-radius:14px;padding:6px 14px}
.goal input{border:0;background:transparent;color:#fff;font-size:30px;font-weight:800;width:100%;min-width:0;outline:none;font-variant-numeric:tabular-nums}
.goal em{font-style:normal;font-size:22px;font-weight:800;opacity:.8}
.big-res{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.big-res .stat b{white-space:nowrap}
.big-res .stat b{font-size:24px}
.big-res .stat.hl{background:var(--brand);color:#fff}.big-res .stat.hl span{color:rgba(255,255,255,.8)}
.bar{height:12px;border-radius:999px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--ok);border-radius:999px}
.srow{display:grid;grid-template-columns:minmax(0,1fr) 130px 36px;gap:8px;align-items:center}
.srow input{border:1.5px solid transparent;background:var(--bg);border-radius:12px;padding:10px;width:100%;min-width:0}
.srow input:focus{border-color:var(--brand);outline:none}
.srow input.num{text-align:right;font-weight:700;font-variant-numeric:tabular-nums}
.lever{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);font-size:14px}
.lever:last-child{border-bottom:0}
.lever b{white-space:nowrap}
.dirty{color:var(--warn);font-weight:700;font-size:13px}
.month{display:flex;align-items:center;gap:8px}
.month b{min-width:130px;text-align:center;font-size:16px}
.cl .delta,.delta{font-size:12px;font-weight:800;margin-left:6px;white-space:nowrap}
.fin-hl .delta{filter:brightness(1.9) saturate(.8)}
.cmp{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:4px 14px;font-variant-numeric:tabular-nums;font-size:14px;align-items:baseline}
.cmp .h{font-size:11.5px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.05em;text-align:right}
.cmp .h:first-child{text-align:left}
.cmp span{color:var(--muted);font-weight:600}.cmp .v{text-align:right;white-space:nowrap}.cmp .pv{text-align:right;color:var(--muted);white-space:nowrap;font-size:13px}
.cmp .tot{color:var(--ink);font-weight:800;padding-top:8px;border-top:1.5px solid var(--line)}
.cmp .tot.v,.cmp .tot.pv{padding-top:8px;border-top:1.5px solid var(--line)}
.catbar{display:flex;flex-direction:column;gap:8px}
.catbar .c{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 10px;font-size:13.5px}
.catbar .c b{font-variant-numeric:tabular-nums}
.catbar .c i{grid-column:1/-1;height:8px;border-radius:999px;background:var(--line);overflow:hidden;display:block}
.catbar .c i em{display:block;height:100%;background:var(--accent);border-radius:999px}
.entry{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 10px;padding:10px 0;border-bottom:1px solid var(--line)}
.entry:last-child{border-bottom:0}
.entry .am{font-weight:800;font-variant-numeric:tabular-nums;text-align:right}
.entry .am.out{color:var(--bad)}.entry .am.in{color:var(--ok)}
.entry .sub{font-size:12.5px;color:var(--muted);font-weight:600}
.seg2{display:flex;flex-wrap:wrap;gap:6px}
.seg2 button{border:1.5px solid var(--line);background:var(--bg);border-radius:999px;padding:7px 12px;font-weight:700;font-size:13px}
.seg2 button[aria-pressed="true"]{background:var(--brand);border-color:var(--brand);color:#fff}
.pay{border:0;border-radius:999px;padding:6px 10px;font-weight:800;font-size:12.5px;background:var(--bad-soft);color:var(--bad)}
.pay.ok{background:var(--ok-soft);color:var(--ok)}
.tabs{overflow-x:auto;scrollbar-width:none}
.tabs button{flex:1 0 auto}
.bar{height:10px;border-radius:999px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;border-radius:999px}
.tabs{display:flex;gap:4px;background:var(--surface);box-shadow:var(--shadow);border-radius:16px;padding:4px}
.tabs button{flex:1;border:0;background:transparent;border-radius:12px;padding:10px 6px;font-weight:800;font-size:14px;color:var(--muted);position:relative}
.tabs button[aria-selected="true"]{background:var(--brand);color:var(--brand-ink)}
.tabs .cnt{display:inline-flex;min-width:20px;height:20px;padding:0 6px;border-radius:999px;background:var(--accent);color:#2A1A03;font-size:11px;align-items:center;justify-content:center;margin-left:6px;vertical-align:1px}
.filters{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.filters select{border:0;background:var(--surface);box-shadow:var(--shadow);border-radius:14px;padding:9px 12px;font-weight:700;font-size:13px;max-width:100%}
.ocard{background:var(--surface);box-shadow:var(--shadow);border-radius:18px;padding:14px;display:flex;flex-direction:column;gap:8px}
.ocard .top-l{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.ocard .who{font-weight:800}
.ocard .sub{font-size:13px;color:var(--muted);font-weight:600}
.ocard .items{font-size:13.5px}
.ocard .bot{display:flex;justify-content:space-between;align-items:center;gap:10px;font-variant-numeric:tabular-nums;flex-wrap:wrap}
.st{border:0;border-radius:999px;padding:6px 10px;font-weight:800;font-size:12.5px}
.st-paid{background:#DDE9F6;color:#2F6FB0}.st-sent{background:var(--accent-soft);color:var(--warn)}.st-ready{background:var(--ok-soft);color:var(--ok)}.st-done{background:var(--line);color:var(--muted)}
.buy{display:flex;flex-direction:column}
.buy .ln{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums}
.buy .ln:last-child{border-bottom:0}
.buy .ln b{font-size:17px;white-space:nowrap}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:13.5px}
.kv dt{color:var(--muted);font-weight:600}.kv dd{margin:0;font-weight:700;min-width:0;overflow-wrap:anywhere}
.code{font-family:ui-monospace,Menlo,monospace;font-weight:800;font-size:17px;letter-spacing:.12em;background:var(--bg);padding:4px 10px;border-radius:10px}
.acts{display:flex;gap:8px;flex-wrap:wrap}
.tag.new{background:var(--accent-soft);color:var(--warn)}
.tag.ok{background:var(--ok-soft);color:var(--ok)}
.sec-h{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-top:6px}
@media (max-width:520px){
  .row{grid-template-columns:56px minmax(0,1fr);grid-template-areas:"t i" "s s"}
  .row .thumb{grid-area:t;width:56px;height:68px}
  .row .info{grid-area:i}
  .row .side{grid-area:s;flex-direction:row;justify-content:space-between;align-items:center}
  .summary{grid-template-columns:repeat(3,1fr)}
  .stat b{font-size:17px}
}
@media (prefers-reduced-motion:reduce){.switch .tr,.switch .tr::after{transition:none}}
</style>

async function rpc(fn, args){
  const res = await fetch(SB_URL + "/rest/v1/rpc/" + fn, {method:"POST", headers:{"apikey":SB_KEY,"Content-Type":"application/json"}, body:JSON.stringify(args)});
  const data = await res.json().catch(()=>null);

  return data;
}

const DEF_SET = {leader:7, acq:1.5, tax:4, logistics:0, target:15};
const S = () => ({...DEF_SET, ...(state.settings||{})});
function econ(price, cost){
  const st = S(); price = +price||0;
  const leader = price*st.leader/100, acq = price*st.acq/100, tax = price*st.tax/100, log = +st.logistics||0;
  const has = cost!==null && cost!=="" && cost!==undefined && !isNaN(+cost);
  cost = has ? +cost : null;
  const profit = has ? price - cost - leader - acq - tax - log : null;
  const k = 1 - (st.leader+st.acq+st.tax+st.target)/100;
  const rec = has && k>0 ? Math.ceil((cost+log)/k/10)*10 : null;
  return {price, cost, leader, acq, tax, log, profit, margin: has&&price ? profit/price*100 : null, markup: has&&cost ? (price-cost)/cost*100 : null, rec, st};
}
const pct = n => (Math.round(n*10)/10).toLocaleString("ru-RU") + "%";
function calcHtml(price, cost){

    <div class="cl"><span>Маржа от цены</span><b class="${e.margin>=0?"good":"bad"}">${pct(e.margin)}</b></div>
    <div class="cl"><span>Наценка на себестоимость</span><b>${e.markup===null?"—":pct(e.markup)}</b></div>

  </div>`;
}
function profitTag(p){
  if(p.cost===null||p.cost===undefined) return `<span class="tag">нет себестоимости</span>`;
  const e = econ(p.price, p.cost);
  return `<span class="tag ${e.profit>=0?"profit":"loss"}">${e.profit>=0?"прибыль":"убыток"} ${fmt(Math.abs(e.profit))} · ${pct(e.margin)}</span>`;

/* ===================== План: сколько продать, чтобы заработать N ===================== */
function plan(){
  if(state.plan) return state.plan;
  const sv = (state.settings||{}).plan || {};
  state.plan = {goal: +sv.goal || 1000000, avgCheck: sv.avgCheck ?? "", costs: Array.isArray(sv.costs) ? sv.costs.filter(([,v])=>+v>0) : []};
  return state.plan;
}
async function loadPlanData(){
  try{ const d = await rpc("adal_admin_orders", {p_pass:state.pass, p_days:30}); state.orders30 = d.orders; }
  catch(ex){ if(!authFail(ex)) toast(ex.message); }
  if(state.pass && state.tab==="plan") viewPlan();
}
const withCost = () => state.products.filter(p=>p.active && p.cost!=null);
function avgMargin(){ // средняя доля прибыли в цене, с весом по продажам за 30 дней
  const w = withCost(); if(!w.length) return null;
  const tot = w.reduce((s,p)=>s+(+p.sold30||0),0);
  const m = p => econ(p.price,p.cost).profit/p.price;
  return tot ? w.reduce((s,p)=>s+m(p)*(+p.sold30||0),0)/tot : w.reduce((s,p)=>s+m(p),0)/w.length;
}
function actual30(){
  const o = state.orders30||[]; if(!o.length) return {n:0, rev:0, profit:0, avg:null};
  const rev = o.reduce((s,x)=>s+x.total,0), am = avgMargin();
  let profit = 0;
  o.forEach(x=>Object.entries(x.items||{}).forEach(([id,q])=>{ const p=state.products.find(z=>z.id==id); if(!p) return;
    profit += (p.cost!=null ? econ(p.price,p.cost).profit : (am!=null? p.price*am : 0))*q; }));
  return {n:o.length, rev, profit, avg: rev/o.length};
}
const cnt = n => isFinite(n) ? Math.ceil(n).toLocaleString("ru-RU") : "—";
function planOutHtml(){
  const P = plan(), am = avgMargin(), act = actual30();
  const check = +P.avgCheck || (act.avg ? Math.round(act.avg) : 5000);
  if(am==null) return `<section class="panel"><h2>Нужна себестоимость</h2><p class="muted" style="margin:0">Впишите себестоимость товаров во вкладке «Товары». Без неё нельзя посчитать, сколько вы зарабатываете с продажи.</p><button class="btn" data-tab="products">Перейти к товарам</button></section>`;
  const costs = (P.costs||[]).reduce((s,[,v])=>s+(+v||0),0), need = P.goal + costs;
  const rev = am>0 ? need/am : Infinity, orders = rev/check;

  const progress = need ? Math.max(0,Math.min(100, act.profit/need*100)) : 0;
  const rows = withCost().map(p=>({p, pr:econ(p.price,p.cost).profit})).sort((a,b)=>b.pr-a.pr);
  return `
  <div class="big-res">
    <div class="stat hl"><b>${isFinite(rev)?fmt(rev):"—"}</b><span>нужно продать в месяц</span></div>
    <div class="stat"><b>${cnt(orders)}</b><span>заказов по ${fmt(check)}</span></div>
    <div class="stat"><b>${cnt(orders/30)}</b><span>заказов в день</span></div>
    <div class="stat"><b>${pct(am*100)}</b><span>вы зарабатываете с каждой продажи</span></div>
  </div>
  <section class="panel">
    <h2>Как посчитано</h2>
    <div class="calc">
      <div class="cl"><span>Хочу заработать</span><b>${fmt(P.goal)}</b></div>
      ${costs?`<div class="cl"><span>+ Расходы в месяц</span><b>${fmt(costs)}</b></div><div class="cl"><span>Итого нужно заработать</span><b>${fmt(need)}</b></div>`:""}
      <div class="cl"><span>С каждых 100 ₸ продаж остаётся</span><b>${fmt(am*100)}</b></div>
      <div class="cl res"><span>Продать на сумму = ${fmt(need).replace(" ₸","")} ÷ ${pct(am*100)}</span><span>${isFinite(rev)?fmt(rev):"—"}</span></div>
      <div class="cl"><span>Заказов = ${isFinite(rev)?fmt(rev).replace(" ₸",""):"—"} ÷ ${fmt(check).replace(" ₸","")}</span><b>${cnt(orders)}</b></div>
    </div>
    <p class="muted" style="margin:0;font-size:13px">Прибыль = цена − себестоимость − налог ${pct(S().tax)} − эквайринг ${pct(S().acq)}${S().leader?` − лидер ${pct(S().leader)}`:""}. Проценты меняются в «Параметрах расчёта» на вкладке «Товары».</p>
  </section>
  <section class="panel">
    <h2>Или одним товаром</h2>
    <p class="muted" style="margin:0;font-size:13px">Сколько штук нужно продать, если продавать только его.</p>
    <div class="buy">${rows.map(({p,pr})=>`<div class="ln"><span>${esc(p.name)}${p.variant?` · ${esc(p.variant)}`:""}<br><span class="muted" style="font-size:12.5px">прибыль ${fmt(pr)} с 1 шт.</span></span><b>${pr>0?cnt(need/pr)+" шт.":"убыток"}</b></div>`).join("")}</div>
    ${state.products.filter(p=>p.active&&p.cost==null).length?`<p class="muted" style="margin:0;font-size:13px">Без себестоимости: ${state.products.filter(p=>p.active&&p.cost==null).length} товаров — они не учтены.</p>`:""}
  </section>
  <section class="panel">
    <h2>Сейчас, за 30 дней</h2>
    <div class="calc">
      <div class="cl"><span>Продано на сумму</span><b>${fmt(act.rev)}</b></div>
      <div class="cl"><span>Заработано</span><b class="good">${fmt(act.profit)}</b></div>
    </div>
    <div class="bar" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${Math.round(progress)}"><i style="width:${progress}%"></i></div>
    <span class="muted" style="font-size:13px">${Math.round(progress)}% от ${fmt(need)}</span>
  </section>`;
}

function pl(m){ // отчёт о прибыли за месяц
  const gross = m.revenue - m.cogs;
  return {gross, net: gross - m.expenses + m.other_income};
}
function delta(cur, prev){
  if(!prev) return "";
  const d = (cur-prev)/Math.abs(prev)*100;
  return `<span class="delta" style="color:${d>=0?"var(--ok)":"var(--bad)"}">${d>=0?"+":""}${Math.round(d)}%</span>`;
}

function openFinance(kind){
  const cats = kind==="expense" ? EXP_CATS : INC_CATS;
  let cat = cats[0], method = "cash";
  const bg = document.createElement("div"); bg.className="sheet-bg";
  bg.innerHTML = `<form class="sheet" id="finForm" role="dialog" aria-label="${kind==="expense"?"Новый расход":"Новый доход"}" novalidate>
    <div class="sheet-head"><h2>${kind==="expense"?"Новый расход":"Новый доход"}</h2><button type="button" class="ghost" data-close>Закрыть</button></div>
    <div class="goal" style="padding:14px"><label for="fAmount">Сумма</label><div class="gin"><input id="fAmount" inputmode="numeric" placeholder="0"><em>₸</em></div></div>
    <div class="field"><span class="flabel" style="font-size:13px;font-weight:700">Категория</span><div class="seg2" id="fCats">${cats.map((c,i)=>`<button type="button" data-cat="${esc(c)}" aria-pressed="${i===0}">${esc(c)}</button>`).join("")}</div></div>
    <div class="field"><span style="font-size:13px;font-weight:700">Чем ${kind==="expense"?"платили":"получили"}</span><div class="seg2" id="fMethods">${Object.entries(PAY).map(([k,v])=>`<button type="button" data-method="${k}" aria-pressed="${k===method}">${v}</button>`).join("")}</div></div>
    <div class="two">
      <div class="field"><label for="fDate">Дата</label><input id="fDate" type="date" value="${isoDay(new Date())}"></div>
      <div class="field"><label for="fNote">Комментарий</label><input id="fNote" maxlength="200" placeholder="${kind==="expense"?"например, поставщик ERA":"необязательно"}"></div>
    </div>
    <p class="err" id="fErr" hidden></p>
    <button class="btn block" type="submit">Сохранить</button></form>`;
  document.body.appendChild(bg);
  bg.addEventListener("click", e => {
    if(e.target===bg || e.target.closest("[data-close]")) return bg.remove();
    const c = e.target.closest("[data-cat]"); if(c){ cat=c.dataset.cat; bg.querySelectorAll("[data-cat]").forEach(x=>x.setAttribute("aria-pressed",x===c)); }
    const m = e.target.closest("[data-method]"); if(m){ method=m.dataset.method; bg.querySelectorAll("[data-method]").forEach(x=>x.setAttribute("aria-pressed",x===m)); }
  });
  bg.querySelector("#fAmount").focus();
  bg.querySelector("#finForm").addEventListener("submit", async e => {
    e.preventDefault();
    const er = bg.querySelector("#fErr"); er.hidden = true;
    const amount = bg.querySelector("#fAmount").value.replace(/\D/g,"");
    if(!amount || +amount<=0){ er.textContent="Укажите сумму"; er.hidden=false; return; }
    try{
      await rpc("adal_admin_finance_add", {p_pass:state.pass, p:{kind, amount, category:cat, method, date:bg.querySelector("#fDate").value, note:bg.querySelector("#fNote").value}});
      bg.remove(); toast(kind==="expense"?`Расход ${fmt(+amount)} записан`:`Доход ${fmt(+amount)} записан`);
      const d = new Date(bg.querySelector("#fDate").value); if(!isNaN(d)) state.fmonth = monthStart(d);
      loadFinance();
    }catch(ex){ er.textContent=ex.message; er.hidden=false; }
  });
}

function downloadCsv(){
  const rows = [["Имя","Телефон","ЖК или адрес","Привёл лидер","Реклама","Telegram","WhatsApp","Дата"]].concat((state.wl?.list||[]).map(w=>[w.name,w.phone,w.place||"",w.ref_name||"",w.src||"",w.tg_username?"@"+w.tg_username:"",w.wa_click_at?"нажал":"",new Date(w.created_at).toLocaleString("ru-RU")]));
  const csv = "﻿" + rows.map(r=>r.map(c=>`"${String(c).replace(/"/g,'""')}"`).join(";")).join("\r\n");
  const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([csv],{type:"text/csv;charset=utf-8"})); a.download = "waitlist.csv";
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(a.href),2000);
}

/* сжатие фото в браузере: максимум 1000 px по длинной стороне, JPEG */
function shrink(file){
  return new Promise((resolve, reject) => {
    const url = URL.createObjectURL(file), img = new Image();
    img.onload = () => {
      const k = Math.min(1, 1000 / Math.max(img.width, img.height));
      const c = document.createElement("canvas"); c.width = Math.round(img.width*k); c.height = Math.round(img.height*k);
      const g = c.getContext("2d"); g.fillStyle = "#F3F5F4"; g.fillRect(0,0,c.width,c.height); g.drawImage(img,0,0,c.width,c.height);
      URL.revokeObjectURL(url); resolve(c.toDataURL("image/jpeg", 0.85));
    };
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error("Не удалось прочитать картинку")); };
    img.src = url;
  });
}

async function load(){
  state.loading = true;
  try{
    const d = await rpc("adal_admin_products", {p_pass:state.pass});
    state.products = d.products; state.settings = d.settings;
  }catch(ex){
    if(/пароль|попыток/i.test(ex.message)){ state.pass=null; store.del(); viewLogin(ex.message); state.loading=false; return false; }
    toast(ex.message);
  }
  state.loading = false; render(); return true;
}

async function saveCost(input){
  const id = +input.dataset.cost, p = state.products.find(x=>x.id===id); if(!p) return;
  const v = input.value.replace(/\D/g,"");
  if(String(p.cost??"") === v){ input.value = v; return; }
  try{
    await rpc("adal_admin_save_product", {p_pass:state.pass, p:{...p, old_price:p.old_price??"", cost:v}});
    p.cost = v===""?null:+v; toast(v===""?"Себестоимость удалена":`Себестоимость: ${fmt(+v)}`); viewList();
  }catch(ex){ toast(ex.message); input.value = p.cost??""; }
}
async function savePrice(input){
  const id = +input.dataset.price, p = state.products.find(x=>x.id===id);
  const v = input.value.replace(/\D/g,"");
  if(!p || String(p.price) === v) { input.value = p?.price ?? v; return; }
  if(!v || +v < 1){ toast("Цена должна быть больше нуля"); input.value = p.price; return; }
  try{
    await rpc("adal_admin_save_product", {p_pass:state.pass, p:{...p, price:v, old_price:p.old_price??""}});
    p.price = +v; input.value = v; setTimeout(viewList, 900);
    const box = input.closest(".price-in"); box.classList.add("saved"); setTimeout(()=>box.classList.remove("saved"),1200);
    toast(`Цена обновлена: ${fmt(+v)}`);
  }catch(ex){ toast(ex.message); input.value = p.price; }
}

      state.settings = {...(state.settings||{}), leader:+v("cRate")};

  }catch(ex){ state.pass = null; state.busy = false; viewLogin(ex.message); }
});

document.addEventListener("click", async e => {
  const b = e.target.closest("button"); if(!b) return;
  if(b.dataset.filter){ state.filter = b.dataset.filter; viewList(); return; }
  if(b.dataset.tab){ setTab(b.dataset.tab); return; }
  if(b.dataset.days){ state.days = +b.dataset.days; loadOrders(); return; }
  if(b.dataset.approve){ openApprove(state.apps.find(a=>a.id==b.dataset.approve)); return; }
  if(b.dataset.askreject){ state.confirm = "rej"+b.dataset.askreject; render(); return; }
  if(b.dataset.asknewcode){ state.confirm = "code"+b.dataset.asknewcode; render(); return; }
  if(b.hasAttribute("data-cancel")){ state.confirm = null; render(); return; }
  if(b.dataset.reject){ try{ await rpc("adal_admin_reject",{p_pass:state.pass,p_app:+b.dataset.reject}); state.confirm=null; toast("Заявка отклонена"); await loadLeaders(); }catch(ex){ toast(ex.message); } return; }
  if(b.dataset.newcode){ try{ const r=await rpc("adal_admin_zk_update",{p_pass:state.pass,p_id:b.dataset.newcode,p_active:null,p_new_code:true}); state.confirm=null; toast("Новый код: "+r.code); await loadLeaders(); }catch(ex){ toast(ex.message); } return; }
  if(b.dataset.copycode){ try{ await navigator.clipboard.writeText(b.dataset.copycode); toast("Код скопирован"); }catch(_){ toast("Код: "+b.dataset.copycode); } return; }
  if(b.dataset.edit){ openEditor(state.products.find(x=>x.id===+b.dataset.edit)); return; }
  if(b.dataset.move){
    b.disabled = true;
    try{ await rpc("adal_admin_move", {p_pass:state.pass, p_id:+b.dataset.move, p_dir:+b.dataset.dir}); await load(); }
    catch(ex){ toast(ex.message); b.disabled = false; }
    return;
  }
  if(b.dataset.act==="new"){ openEditor(null); return; }
  if(b.dataset.act==="calcset"){ openCalcSettings(); return; }
  if(b.dataset.act==="csv"){ downloadCsv(); return; }
  if(b.dataset.askwldel){ state.confirm="wl"+b.dataset.askwldel; viewWaitlist(); return; }
  if(b.dataset.wldel){ try{ await rpc("adal_admin_waitlist_delete",{p_pass:state.pass,p_id:+b.dataset.wldel}); state.confirm=null; toast("Запись удалена"); await loadWaitlist(); }catch(ex){ toast(ex.message); } return; }
  if(b.dataset.askship){ state.confirm="ship"+b.dataset.askship; viewLeaders(); return; }
  if(b.dataset.ship){ b.disabled=true; try{ const r=await rpc("adal_admin_ship",{p_pass:state.pass,p_zk:b.dataset.ship,p_force:!!b.dataset.force}); state.confirm=null; toast(`Отправлено в закупку: ${r.count} заказов`); await loadLeaders(); }catch(ex){ toast(ex.message); b.disabled=false; } return; }
  if(b.dataset.payout){ const id=b.dataset.payout; if(state.confirm!=="pay"+id){ state.confirm="pay"+id; viewLeaders(); return; }
    b.disabled=true; try{ const r=await rpc("adal_admin_payout",{p_pass:state.pass,p_zk:id}); state.confirm=null; toast(`Выплата ${fmt(r.amount)} записана в расходы`); await loadLeaders(); }catch(ex){ toast(ex.message); b.disabled=false; } return; }
  if(b.dataset.act==="delivery"){ openDelivery(); return; }
  if(b.dataset.fin){ openFinance(b.dataset.fin); return; }
  if(b.dataset.fmonth){ const d=state.fmonth; state.fmonth=new Date(d.getFullYear(), d.getMonth()+(+b.dataset.fmonth), 1); state.fin=null; loadFinance(); return; }
  if(b.dataset.askfdel){ state.confirm="fe"+b.dataset.askfdel; viewFinance(); return; }
  if(b.dataset.fdel){ try{ await rpc("adal_admin_finance_delete",{p_pass:state.pass,p_id:+b.dataset.fdel}); state.confirm=null; toast("Запись удалена"); loadFinance(); }catch(ex){ toast(ex.message); } return; }
  if(b.dataset.markpaid){ b.disabled=true; try{ await rpc("adal_admin_order_paid",{p_pass:state.pass,p_id:+b.dataset.markpaid,p_paid:true,p_method:b.dataset.m}); toast(`Заказ №${b.dataset.markpaid} оплачен`); loadFinance(); }catch(ex){ toast(ex.message); b.disabled=false; } return; }
  if(b.dataset.act==="costadd"){ const P=plan(); P.costs=P.costs||[]; P.costs.push(["",0]); viewPlan(); planChanged(); const ins=document.querySelectorAll("[data-costname]"); ins[ins.length-1].focus(); return; }
  if(b.dataset.costdel){ plan().costs.splice(+b.dataset.costdel,1); viewPlan(); planChanged(); return; }
  if(b.dataset.act==="saveplan"){
    b.disabled = true;
    try{ await rpc("adal_admin_save_plan",{p_pass:state.pass,p:plan()}); state.settings = {...(state.settings||{}), plan:JSON.parse(JSON.stringify(plan()))}; const d=$("#planDirty"); if(d) d.hidden=true; toast("План сохранён"); }
    catch(ex){ toast(ex.message); }
    b.disabled = false; return;
  }
  if(b.dataset.act==="logout"){ state.pass=null; store.del(); viewLogin(); return; }
  if(b.dataset.act==="settings"){ openPassword(); return; }
});

document.addEventListener("change", async e => {
  const t = e.target;
  
  if(t.id==="oSt"){ state.ost=t.value; render(); return; }
  if(t.dataset.ostatus){
    const id=+t.dataset.ostatus, o=state.orders.find(x=>x.id===id), prev=o.status;
    try{ await rpc("adal_admin_order_status",{p_pass:state.pass,p_id:id,p_status:t.value}); o.status=t.value; toast(`Заказ №${id}: ${STATUS[t.value]}`); render(); }
    catch(ex){ toast(ex.message); t.value=prev; }
    return;
  }
  if(t.dataset.opay){
    const id=+t.dataset.opay, o=state.orders.find(x=>x.id===id), v=t.value;
    try{ await rpc("adal_admin_order_paid",{p_pass:state.pass,p_id:id,p_paid:!!v,p_method:v||null}); o.paid=!!v; o.pay_method=v||null; toast(v?`Заказ №${id} оплачен · ${PAY[v]}`:`Заказ №${id}: не оплачен`); render(); }
    catch(ex){ toast(ex.message); render(); }
    return;
  }
  if(t.dataset.zkactive){
    try{ await rpc("adal_admin_zk_update",{p_pass:state.pass,p_id:t.dataset.zkactive,p_active:t.checked,p_new_code:false}); toast(t.checked?"ЖК снова на сайте":"ЖК скрыт с сайта"); await loadLeaders(); }
    catch(ex){ toast(ex.message); t.checked=!t.checked; }
  }
});
document.addEventListener("input", e => {
  if(e.target.id==="wq"){ state.wq=e.target.value; const pos=e.target.selectionStart; viewWaitlist(); const q=$("#wq"); q.focus(); q.setSelectionRange(pos,pos); return; }
  const t = e.target, P = state.tab==="plan" ? plan() : null;
  if(P && t.dataset.costname!==undefined){ P.costs[+t.dataset.costname][0]=t.value; planChanged(); return; }
  if(P && t.dataset.costsum!==undefined){ P.costs[+t.dataset.costsum][1]=+t.value.replace(/\D/g,"")||0; planChanged(); return; }
  if(P && t.dataset.plan){ const v=t.value.replace(/\D/g,""); P[t.dataset.plan] = v==="" ? (t.dataset.plan==="goal"?0:"") : +v; planChanged(); return; }
  if(e.target.id === "q"){ state.q = e.target.value; const pos = e.target.selectionStart; viewList(); const q=$("#q"); q.focus(); q.setSelectionRange(pos,pos); }
});
document.addEventListener("keydown", e => {
  if(e.key === "Enter" && e.target.dataset && (e.target.dataset.price || e.target.dataset.cost)){ e.preventDefault(); e.target.blur(); }
});
document.addEventListener("focusout", e => { if(e.target.dataset && e.target.dataset.price) savePrice(e.target); if(e.target.dataset && e.target.dataset.cost) saveCost(e.target); });

function openDelivery(){
  const D = {trip:15000, per_trip:30, fee:500, free_from:0, ...((state.settings||{}).delivery||{})};
  const bg = document.createElement("div"); bg.className="sheet-bg";
  const f = (id,label,val,hint) => `<div class="field"><label for="${id}">${label}</label><input id="${id}" data-dv="${id}" inputmode="numeric" value="${esc(val)}">${hint?`<span class="hint">${hint}</span>`:""}</div>`;
  bg.innerHTML = `<form class="sheet" id="dvForm" role="dialog" aria-label="Доставка" novalidate>
    <div class="sheet-head"><h2>Доставка</h2><button type="button" class="ghost" data-close>Закрыть</button></div>
    <div class="two">
      ${f("trip","Рейс машины, ₸",D.trip,"Водитель + бензин за один развоз")}
      ${f("per_trip","Заказов в рейсе",D.per_trip,"Сколько заказов везёте за раз")}
      ${f("fee","Платная доставка, ₸",D.fee,"Сколько платит покупатель за маленький заказ")}
      ${f("free_from","Бесплатно от, ₸",D.free_from,"0 — доставка всегда платная")}
    </div>
    <div id="dvCalc"></div>
    <p class="err" id="dvErr" hidden></p>
    <button class="btn block" type="submit">Сохранить</button></form>`;
  document.body.appendChild(bg);
  const val = id => +bg.querySelector("#"+id).value.replace(/\D/g,"")||0;
  const calc = () => {
    const per = val("per_trip") ? val("trip")/val("per_trip") : 0;
    const m = avgMargin(); const free = val("free_from"), fee = val("fee");
    let h = `<div class="calc"><div class="cl"><span>Доставка одного заказа стоит вам</span><b>${fmt(per)}</b></div>`;
    if(m==null || m<=0){
      h += `<span class="muted" style="font-size:13px">Чтобы посчитать порог бесплатной доставки, заполните себестоимость товаров.</span></div>`;
    } else {
      const be = Math.ceil(per/m/100)*100, rec = Math.ceil(2*per/m/100)*100;
      h += `<div class="cl"><span>С каждых 100 ₸ товара вы зарабатываете</span><b>${fmt(m*100)}</b></div>
        <div class="cl"><span>Заказ окупает доставку от</span><b>${fmt(be)}</b></div>
        <div class="cl res"><span>Бесплатно рекомендуем от</span><span>${fmt(rec)}</span></div>
        <span class="muted" style="font-size:12.5px">При таком заказе доставка съедает не больше половины прибыли.</span>
        ${rec!==free?`<div class="rec"><span>Поставить порог ${fmt(rec)}</span><button type="button" data-setfree="${rec}">Поставить</button></div>`:""}`;
      if(free>0){
        const pr = free*m - per;
        h += `<div class="cl" style="margin-top:8px"><span>Заказ на ${fmt(free)} с бесплатной доставкой</span><b class="${pr>=0?"good":"bad"}">${pr<0?"−":""}${fmt(Math.abs(pr))} прибыли</b></div>`;
      }
      const small = 2000, prs = small*m - per + fee;
      h += `<div class="cl"><span>Заказ на ${fmt(small)} с платной доставкой ${fmt(fee)}</span><b class="${prs>=0?"good":"bad"}">${prs<0?"−":""}${fmt(Math.abs(prs))} прибыли</b></div></div>`;
    }
    bg.querySelector("#dvCalc").innerHTML = h;
  };
  calc();
  bg.addEventListener("input", calc);
  bg.addEventListener("click", e => {
    if(e.target===bg || e.target.closest("[data-close]")) return bg.remove();
    const sf = e.target.closest("[data-setfree]"); if(sf){ bg.querySelector("#free_from").value = sf.dataset.setfree; calc(); }
  });
  bg.querySelector("#dvForm").addEventListener("submit", async e => {
    e.preventDefault();
    const body = {trip:val("trip"), per_trip:val("per_trip"), fee:val("fee"), free_from:val("free_from")};
    try{ const r = await rpc("adal_admin_save_delivery", {p_pass:state.pass, p:body}); state.settings = {...(state.settings||{}), delivery:r.delivery}; bg.remove(); toast("Доставка сохранена — на сайте обновится сразу"); }
    catch(ex){ const er=bg.querySelector("#dvErr"); er.textContent=ex.message; er.hidden=false; }
  });
}
function openCalcSettings(){
  const st = S();
  const bg = document.createElement("div"); bg.className="sheet-bg";
  bg.innerHTML = `<form class="sheet" id="csForm" role="dialog" aria-label="Параметры расчёта" novalidate>
    <div class="sheet-head"><h2>Параметры расчёта</h2><button type="button" class="ghost" data-close>Закрыть</button></div>
    <p class="muted" style="margin:0">Эти расходы вычитаются из цены каждого товара при расчёте прибыли.</p>
    <div class="two">
      <div class="field"><label for="csLeader">Комиссия лидера, %</label><input id="csLeader" inputmode="decimal" value="${st.leader}"></div>
      <div class="field"><label for="csAcq">Эквайринг, %</label><input id="csAcq" inputmode="decimal" value="${st.acq}"></div>
      <div class="field"><label for="csTax">Налог, % от цены</label><input id="csTax" inputmode="decimal" value="${st.tax}"><span class="hint">ИП на упрощёнке — 4%.</span></div>
      <div class="field"><label for="csLog">Доставка на 1 шт., ₸</label><input id="csLog" inputmode="decimal" value="${st.logistics}"><span class="hint">Расходы на машину ÷ число штук в рейсе.</span></div>
      <div class="field" style="grid-column:1/-1"><label for="csTarget">Желаемая маржа, %</label><input id="csTarget" inputmode="decimal" value="${st.target}"><span class="hint">По ней считается рекомендуемая цена.</span></div>
    </div>
    <p class="err" id="csErr" hidden></p>
    <button class="btn block" type="submit">Сохранить</button></form>`;
  document.body.appendChild(bg);
  bg.addEventListener("click", e => { if(e.target===bg || e.target.closest("[data-close]")) bg.remove(); });
  bg.querySelector("#csForm").addEventListener("submit", async e => {
    e.preventDefault();
    const num = id => bg.querySelector(id).value.replace(",",".").trim();
    const body = {leader:num("#csLeader"), acq:num("#csAcq"), tax:num("#csTax"), logistics:num("#csLog"), target:num("#csTarget")};
    try{ const r = await rpc("adal_admin_save_settings", {p_pass:state.pass, p:body}); state.settings = r.settings; bg.remove(); toast("Параметры сохранены"); render(); }
    catch(ex){ const er=bg.querySelector("#csErr"); er.textContent=ex.message; er.hidden=false; }
  });
}
function openPassword(){
  const bg = document.createElement("div"); bg.className="sheet-bg";
  bg.innerHTML = `<form class="sheet" id="pwForm" role="dialog" aria-label="Смена пароля" novalidate>
    <div class="sheet-head"><h2>Смена пароля</h2><button type="button" class="ghost" data-close>Закрыть</button></div>
    <div class="field"><label for="np1">Новый пароль</label><input id="np1" type="password" autocomplete="new-password" minlength="8"></div>
    <div class="field"><label for="np2">Повторите пароль</label><input id="np2" type="password" autocomplete="new-password" minlength="8"><span class="hint">Не короче 8 символов.</span></div>
    <p class="err" id="pwErr" hidden></p>
    <button class="btn block" type="submit">Сменить пароль</button></form>`;
  document.body.appendChild(bg);
  bg.addEventListener("click", e => { if(e.target===bg || e.target.closest("[data-close]")) bg.remove(); });
  bg.querySelector("#np1").focus();
  bg.querySelector("#pwForm").addEventListener("submit", async e => {
    e.preventDefault();
    const a = bg.querySelector("#np1").value, b2 = bg.querySelector("#np2").value, er = bg.querySelector("#pwErr");
    if(a.length < 8){ er.textContent="Пароль должен быть не короче 8 символов"; er.hidden=false; return; }
    if(a !== b2){ er.textContent="Пароли не совпадают"; er.hidden=false; return; }
    try{ await rpc("adal_admin_change_password", {p_pass:state.pass, p_new:a}); state.pass=a; store.set(a); bg.remove(); toast("Пароль изменён"); }
    catch(ex){ er.textContent=ex.message; er.hidden=false; }
  });
}

if(state.pass){ load().then(ok=>{ if(ok){ loadLeaders(); if(state.tab==='orders') loadOrders(); if(state.tab==='plan') loadPlanData(); if(state.tab==='finance') loadFinance(); if(state.tab==='waitlist') loadWaitlist(); } }); } else { viewLogin(); }
</script>
