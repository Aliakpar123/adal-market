<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="ADAL market — совместные закупки для жителей ЖК по оптовым ценам.">
<meta name="theme-color" content="#0F4C4A">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<title>ADAL market</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700&family=Manrope:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: phone app shell (max 480px), sticky top bar, fixed bottom tabs; four views — Магазин, Корзина, Как это работает, Кабинет лидера */
:root{
  --bg:#F3F6F5; --surface:#FFFFFF; --ink:#0E2B2C; --muted:#5D7273; --line:#DCE5E3;
  --brand:#0F4C4A; --brand-ink:#FFFFFF; --accent:#E9A23B; --accent-soft:#FBEBD2;
  --ok:#2E8B57; --ok-soft:#DDF1E5; --warn:#B7701A; --info:#2F6FB0; --info-soft:#DDE9F6;
  --font-display:"Unbounded", "Manrope", system-ui, sans-serif;
  --font-body:"Manrope", system-ui, -apple-system, "Segoe UI", sans-serif;
  --r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0B1817; --surface:#132422; --ink:#E6F0EE; --muted:#93A9A6; --line:#233A38;
  --brand:#5FC1B6; --brand-ink:#05201E; --accent:#F0B45A; --accent-soft:#3A2C16;
  --ok:#5CC98B; --ok-soft:#173527; --warn:#E9A64D; --info:#7FB2E8; --info-soft:#18293C; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0B1817; --surface:#132422; --ink:#E6F0EE; --muted:#93A9A6; --line:#233A38;
  --brand:#5FC1B6; --brand-ink:#05201E; --accent:#F0B45A; --accent-soft:#3A2C16;
  --ok:#5CC98B; --ok-soft:#173527; --warn:#E9A64D; --info:#7FB2E8; --info-soft:#18293C; color-scheme:dark}

*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:15px;line-height:1.45}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible,a:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.app{max-width:480px;margin:0 auto;min-height:100vh;padding-bottom:calc(84px + env(safe-area-inset-bottom,0px))}
.wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--brand)}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--brand);color:var(--brand-ink);padding-block:12px}
.top-row{display:flex;align-items:center;justify-content:space-between;gap:12px}
.logo{font-family:var(--font-display);font-weight:700;font-size:19px;letter-spacing:.02em}
.logo small{font-weight:500;opacity:.75;font-size:12px;margin-left:4px}
.zk{display:flex;align-items:center;gap:6px;background:color-mix(in srgb,var(--brand-ink) 14%,transparent);border:0;border-radius:999px;padding:6px 12px;font-size:13px;font-weight:600;color:var(--brand-ink);max-width:60%}
.zk span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.deadline{margin-top:10px;display:flex;gap:10px;align-items:center;background:var(--accent);color:#2A1A03;border-radius:10px;padding:8px 12px;font-size:13px;font-weight:600}
.deadline b{font-variant-numeric:tabular-nums;font-size:15px}

h1,h2,h3{font-family:var(--font-display);font-weight:700;text-wrap:balance;margin:0}
h1{font-size:22px;line-height:1.2} h2{font-size:17px} h3{font-size:15px}
.muted{color:var(--muted)}
.section{display:flex;flex-direction:column;gap:14px;padding-block:18px}
.label{font-size:11px;text-transform:uppercase;letter-spacing:.08em;font-weight:700;color:var(--muted)}

.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.chip{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 14px;font-size:13px;font-weight:600}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}

.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px;display:flex;flex-direction:column;gap:8px;min-width:0}
.thumb{aspect-ratio:4/3;max-width:100%;border-radius:10px;display:flex;flex-direction:column;justify-content:space-between;padding:10px;color:#fff}
.thumb .w{font-family:var(--font-display);font-size:22px;font-weight:700;line-height:1}
.thumb .c{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;opacity:.9}
.thumb .br{display:block;font-family:var(--font-display);font-size:22px;font-weight:700;line-height:1.05;text-shadow:0 1px 2px rgba(0,0,0,.25)}
.thumb .v{display:block;font-size:12px;font-weight:700;opacity:.95;margin-top:2px}
.thumb .w{font-size:15px;align-self:flex-start;background:rgba(0,0,0,.22);padding:3px 8px;border-radius:6px}
.err{background:var(--accent-soft);color:var(--warn);border-radius:10px;padding:10px 12px;font-size:13px;font-weight:600;margin:0}
.skel .thumb{background:var(--line)}
.sk{height:12px;border-radius:6px;background:var(--line)}
.sk.short{width:60%}
.c-groc{background:linear-gradient(140deg,#B9802F,#8A5A1B)}
.c-oil{background:linear-gradient(140deg,#C49A1E,#8F6C0C)}
.c-can{background:linear-gradient(140deg,#A0453B,#6E2A23)}
.c-tea{background:linear-gradient(140deg,#3E7A55,#245038)}
.c-home{background:linear-gradient(140deg,#3E6FA3,#24476F)}
.name{font-weight:700;font-size:14px;line-height:1.25}
.price-row{display:flex;align-items:baseline;gap:6px;flex-wrap:wrap}
.price{font-weight:800;font-size:16px;font-variant-numeric:tabular-nums}
.old{color:var(--muted);text-decoration:line-through;font-size:12px;font-variant-numeric:tabular-nums}
.save{font-size:11px;font-weight:800;color:var(--ok);background:var(--ok-soft);padding:2px 6px;border-radius:6px}
.btn{border:0;border-radius:10px;padding:10px 14px;font-weight:700;background:var(--brand);color:var(--brand-ink)}
.btn.block{width:100%;padding:14px;font-size:16px}
.btn.ghost{background:transparent;border:1.5px solid var(--line);color:var(--ink)}
.btn.accent{background:var(--accent);color:#2A1A03}
.btn:disabled{opacity:.45;cursor:not-allowed}
.qty{display:flex;align-items:center;justify-content:space-between;border:1.5px solid var(--brand);border-radius:10px;overflow:hidden}
.qty button{border:0;background:transparent;width:38px;height:38px;font-size:20px;font-weight:700;color:var(--brand)}
.qty span{font-weight:800;font-variant-numeric:tabular-nums}

.line{display:flex;gap:12px;align-items:center;padding-block:12px;border-bottom:1px solid var(--line)}
.line:last-child{border-bottom:0}
.line .mini{width:52px;height:52px;flex:none;border-radius:10px;display:flex;align-items:center;justify-content:center;color:#fff;font-family:var(--font-display);font-size:12px;font-weight:700;text-align:center}
.line .grow{flex:1;min-width:0}
.line .qty{width:112px;flex:none}
.sum-row{display:flex;justify-content:space-between;gap:12px;font-variant-numeric:tabular-nums}
.sum-row.total{font-weight:800;font-size:18px;padding-top:8px;border-top:1px solid var(--line)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;display:flex;flex-direction:column;gap:10px}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:13px;font-weight:700}
.field input,.field select{border:1.5px solid var(--line);background:var(--bg);border-radius:10px;padding:12px;font:inherit;color:var(--ink);width:100%}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.note{background:var(--accent-soft);border-radius:12px;padding:12px 14px;font-size:13px}
.empty{text-align:center;padding:40px 16px;display:flex;flex-direction:column;gap:12px;align-items:center}

/* how it works */
.steps{display:flex;flex-direction:column;gap:0}
.step{display:grid;grid-template-columns:40px 1fr;gap:12px;position:relative;padding-bottom:18px}
.step:not(:last-child)::before{content:"";position:absolute;left:19px;top:40px;bottom:0;width:2px;background:var(--line)}
.step .n{width:40px;height:40px;border-radius:50%;background:var(--brand);color:var(--brand-ink);display:flex;align-items:center;justify-content:center;font-family:var(--font-display);font-weight:700}
.step .t{font-weight:800}
.step .time{display:inline-block;font-size:12px;font-weight:700;color:var(--warn);margin-bottom:2px}
.compare{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.compare .panel{gap:6px}
.big{font-family:var(--font-display);font-size:22px;font-weight:700;font-variant-numeric:tabular-nums}
.who{display:grid;grid-template-columns:1fr;gap:10px}

/* leader */
.hero-l{background:var(--brand);color:var(--brand-ink);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:12px}
.hero-l .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.hero-l .s{background:color-mix(in srgb,var(--brand-ink) 12%,transparent);border-radius:10px;padding:10px}
.hero-l .s b{display:block;font-family:var(--font-display);font-size:17px;font-variant-numeric:tabular-nums}
.hero-l .s small{font-size:11px;opacity:.85}
.invite{display:flex;gap:8px;align-items:center;background:color-mix(in srgb,var(--brand-ink) 12%,transparent);border-radius:10px;padding:8px 8px 8px 12px}
.invite code{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:13px}
.invite button{border:0;background:var(--accent);color:#2A1A03;border-radius:8px;padding:8px 12px;font-weight:700;font-size:13px}
.progress{display:flex;gap:4px}
.progress i{flex:1;height:6px;border-radius:3px;background:var(--line)}
.progress i.on{background:var(--brand)}
.stage{display:flex;justify-content:space-between;font-size:11px;font-weight:700;color:var(--muted);gap:4px}
.stage .cur{color:var(--brand)}
.order{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:6px}
.order-top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.pill{font-size:11px;font-weight:800;padding:3px 8px;border-radius:999px;white-space:nowrap}
.p-paid{background:var(--info-soft);color:var(--info)}
.p-sent{background:var(--accent-soft);color:var(--warn)}
.p-ready{background:var(--ok-soft);color:var(--ok)}
.p-done{background:var(--line);color:var(--muted)}
.order .items{font-size:13px;color:var(--muted)}
.order .bot{display:flex;justify-content:space-between;align-items:center;gap:8px;font-variant-numeric:tabular-nums}
.order .bot .btn{padding:7px 12px;font-size:13px}
.new{animation:flash 1.6s ease-out}
@keyframes flash{from{box-shadow:0 0 0 3px var(--accent)}to{box-shadow:0 0 0 0 transparent}}
.tabs-l{display:flex;gap:8px}

/* bottom nav */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
.nav-in{max-width:480px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr)}
.nav button{border:0;background:transparent;padding:10px 4px 12px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;font-weight:700;color:var(--muted);position:relative}
.nav button[aria-current="page"]{color:var(--brand)}
.nav svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.badge{position:absolute;top:5px;left:calc(50% + 6px);background:var(--accent);color:#2A1A03;border-radius:999px;font-size:10px;font-weight:800;min-width:18px;height:18px;padding:0 5px;display:flex;align-items:center;justify-content:center}
.toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-weight:700;font-size:14px;z-index:20;max-width:calc(100% - 32px)}
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:30;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:480px;border-radius:18px 18px 0 0;padding:20px max(16px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:10px}
.opt{display:flex;justify-content:space-between;align-items:center;gap:10px;border:1.5px solid var(--line);background:var(--bg);border-radius:12px;padding:12px 14px;text-align:left}
.opt[aria-pressed="true"]{border-color:var(--brand)}
.demo{font-size:12px;color:var(--muted);text-align:center;padding-block:4px 10px}
.reg-hero{background:var(--brand);color:var(--brand-ink);border-radius:var(--r);padding:18px 16px;display:flex;flex-direction:column;gap:10px}
.calc{background:color-mix(in srgb,var(--brand-ink) 12%,transparent);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:8px;font-size:14px}
.calc input{width:100%;accent-color:var(--accent)}
.calc-out{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
.calc-out b{font-family:var(--font-display);font-size:20px;color:var(--accent);font-variant-numeric:tabular-nums}
.calc small{opacity:.8;font-size:12px}
.duties{display:grid;gap:8px}
.duty{display:flex;flex-direction:column;gap:2px;padding:12px 14px;border-left:3px solid var(--accent);background:var(--surface);border-radius:0 10px 10px 0}
.flabel{font-size:13px;font-weight:700}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.seg button{border:1.5px solid var(--line);background:var(--bg);border-radius:10px;padding:10px 4px;font-size:13px;font-weight:700}
.seg button[aria-pressed="true"]{border-color:var(--brand);background:var(--brand);color:var(--brand-ink)}
.check{display:flex;gap:10px;align-items:flex-start;font-size:13px}
.check input{width:20px;height:20px;flex:none;margin:0;accent-color:var(--brand)}
.err{background:var(--accent-soft);color:var(--warn);border-radius:10px;padding:10px 12px;font-size:13px;font-weight:600}
.field input.bad,.field select.bad{border-color:var(--warn)}
.logout{border:0;background:color-mix(in srgb,var(--brand-ink) 14%,transparent);color:var(--brand-ink);border-radius:8px;padding:6px 10px;font-size:12px;font-weight:700;flex:none}
@media (prefers-reduced-motion:reduce){.new{animation:none}}
</style>
</head>
<body>

<div class="app">
  <header class="top wrap">
    <div class="top-row">
      <div class="logo">ADAL<small>market</small></div>
      <button class="zk" id="zkBtn" aria-label="Выбрать свой ЖК">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M3 21h18M5 21V7l7-4 7 4v14M9 21v-6h6v6"/></svg>
        <span id="zkName"></span>
      </button>
    </div>
    <div class="deadline" id="deadline">Приём заказов до 21:00 · осталось <b id="cd">--:--:--</b></div>
  </header>

  <main id="view"></main>
  <p class="demo wrap">Тестовый запуск: оплата при получении, фото товаров скоро появятся.</p>
</div>

<nav class="nav" aria-label="Разделы">
  <div class="nav-in">
    <button data-go="shop"><svg viewBox="0 0 24 24"><path d="M3 9l1.5-5h15L21 9M3 9h18v11H3zM9 13h6"/></svg>Магазин</button>
    <button data-go="cart"><svg viewBox="0 0 24 24"><circle cx="9" cy="20" r="1.5"/><circle cx="18" cy="20" r="1.5"/><path d="M2 3h3l2.6 12.4a1 1 0 0 0 1 .8h9.7a1 1 0 0 0 1-.8L21 7H6"/></svg>Корзина<span class="badge" id="cartBadge" hidden>0</span></button>
    <button data-go="how"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M9.5 9a2.5 2.5 0 1 1 3.5 2.3c-.6.3-1 .9-1 1.6V14M12 17.5h.01"/></svg>Как это работает</button>
    <button data-go="leader"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 3.6-7 8-7s8 3 8 7"/></svg>Лидер ЖК</button>
  </div>
</nav>

<script>
/* ===== Supabase (публичный ключ, доступ ограничен RLS и RPC-функциями) ===== */
const SB_URL = "https://fakhibznbnfycafgvfiw.supabase.co";
const SB_KEY = "sb_publishable_CtZFCSLjUTde5NRtGizYyQ_nSJ7LQU2";
async function api(path, body){
  const res = await fetch(SB_URL + "/rest/v1/" + path, {
    method: body===undefined ? "GET" : "POST",
    headers: {"apikey": SB_KEY, "Content-Type":"application/json"},
    body: body===undefined ? undefined : JSON.stringify(body)
  });
  const data = await res.json().catch(()=>null);
  if(!res.ok) throw new Error((data && (data.message||data.hint)) || "Ошибка сети");
  return data;
}
const rpc = (fn, args) => api("rpc/" + fn, args);

const COMMISSION = 0.07;
const CATS = {clean:"Чистящие средства", soap:"Мыло", dish:"Для посуды", wash:"Для стирки"};
const STATUS = {
  paid:{t:"Оплачен", c:"p-paid"}, sent:{t:"У поставщика", c:"p-sent"},
  ready:{t:"Привезли · выдать", c:"p-ready"}, done:{t:"Выдан", c:"p-done"}
};
let ZKS = [], PRODUCTS = [];

const ss = {
  get(k){ try{ return JSON.parse(localStorage.getItem(k)); }catch(_){ return null; } },
  set(k,v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(_){} },
  del(k){ try{ localStorage.removeItem(k); }catch(_){} }
};

const state = {
  view:"shop", cat:"all", zk: ss.get("adal-zk") || "sp", cart: ss.get("adal-cart") || {},
  loading:true, loadError:null, busy:false,
  leaderTab:"orders", lastNew:null, leader: ss.get("adal-leader"), // {zk, code}
  ld:null, ldError:null, leaderMode:"reg", regDone:false, calc:30,
  reg:{name:"",phone:"",city:"Алматы",zk:"",addr:"",flats:"200–500",chat:"WhatsApp",members:"",spot:"Холл или консьерж",pay:"Самозанятый",agree:false}
};

const $ = s => document.querySelector(s);
const fmt = n => Math.round(n).toLocaleString("ru-RU").replace(/ |,/g," ") + " ₸";
const prod = id => PRODUCTS.find(p=>p.id==id);
const pName = id => { const p=prod(id); return p ? `${p.name}${p.variant?" · "+p.variant:""}` : `Товар №${id}`; };
const cartSum = () => Object.entries(state.cart).reduce((s,[id,q])=>s+(prod(id)?.price||0)*q,0);
const cartOld = () => Object.entries(state.cart).reduce((s,[id,q])=>{const p=prod(id); return s+((p?.old_price||p?.price||0))*q;},0);
const cartCount = () => Object.values(state.cart).reduce((a,b)=>a+b,0);
const zk = () => ZKS.find(z=>z.id===state.zk) || ZKS[0] || {id:"",name:"Выберите ЖК",leader_name:""};
const esc = s => String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const saveCart = () => ss.set("adal-cart", state.cart);

function toast(msg){
  const t=document.createElement("div"); t.className="toast"; t.textContent=msg; t.setAttribute("role","status");
  document.body.appendChild(t); setTimeout(()=>t.remove(),2600);
}
const tile = p => `background:linear-gradient(150deg,${esc(p.color||"#0F4C4A")},${esc(p.color2||p.color||"#0F4C4A")})`;

/* ---------- views ---------- */
function qtyCtl(id){
  const q=state.cart[id]||0;
  if(!q) return `<button class="btn" data-add="${id}">В корзину</button>`;
  return `<div class="qty"><button data-dec="${id}" aria-label="Меньше">−</button><span>${q}</span><button data-add="${id}" aria-label="Больше">+</button></div>`;
}

function viewShop(){
  if(state.loading) return `<section class="section wrap"><div class="grid">${Array.from({length:4},()=>`<div class="card skel"><div class="thumb"></div><div class="sk"></div><div class="sk short"></div></div>`).join("")}</div></section>`;
  if(state.loadError) return `<section class="wrap empty"><h2>Не удалось загрузить каталог</h2><p class="muted">${esc(state.loadError)}. Проверьте интернет и попробуйте ещё раз.</p><button class="btn" data-act="reload">Обновить</button></section>`;
  const cats = Object.keys(CATS).filter(k=>PRODUCTS.some(p=>p.cat===k));

/* ----- кабинет лидера ----- */
function stageOf(orders){
  if(!orders.length) return 0;
  if(orders.every(o=>o.st==="done")) return 3;
  if(orders.some(o=>o.st==="ready")) return 2;
  if(orders.some(o=>o.st==="sent")) return 1;
  return 0;
}
function viewLeader(){
  if(!state.leader) return state.leaderMode==="login" ? viewLogin() : (state.regDone ? viewRegDone() : viewReg());
  if(state.ldError) return `<section class="wrap empty"><h2>Не удалось открыть кабинет</h2><p class="muted">${esc(state.ldError)}</p><button class="btn" data-act="loadleader">Повторить</button><button class="btn ghost" data-act="logout">Выйти</button></section>`;
  if(!state.ld) return `<section class="wrap empty"><p class="muted">Загружаем заказы…</p></section>`;
  const {zk:z, orders, history} = state.ld;
  const sumAll=orders.reduce((s,o)=>s+o.total,0);
  const paid=orders.filter(o=>o.st==="paid");
  const stageIdx=stageOf(orders);
  const stages=["Сбор","Закупка","Привезли","Выдано"];
  const dis = state.busy?"disabled":"";
  let action="";
  if(stageIdx===0) action=`<button class="btn accent block" data-act="close" ${paid.length&&!state.busy?"":"disabled"}>Закрыть сбор и отправить ${paid.length} заказов в ADAL</button>`;
  else if(stageIdx===1) action=`<button class="btn accent block" data-act="arrive" ${dis}>Машина приехала в ЖК</button>`;
  else if(stageIdx===2) action=`<p class="note" style="margin:0">Отмечайте выдачу у каждого соседа. Осталось выдать: <b>${orders.filter(o=>o.st==="ready").length}</b></p>`;
  else action=`<button class="btn block" data-act="newround" ${dis}>Начать новый сбор</button>`;
  if(paid.length && stageIdx>0) action += `<p class="muted" style="margin:0;font-size:13px">Новых заказов после закрытия сбора: ${paid.length}. Они уйдут в следующий сбор.</p>`;

  const tabs=`<div class="tabs-l chips" role="group" aria-label="Разделы кабинета">
    <button class="chip" data-ltab="orders" aria-pressed="${state.leaderTab==="orders"}">Заказы соседей</button>
    <button class="chip" data-ltab="summary" aria-pressed="${state.leaderTab==="summary"}">Сводка для закупки</button>
    <button class="chip" data-ltab="money" aria-pressed="${state.leaderTab==="money"}">Мой доход</button>
    <button class="chip" data-act="loadleader">Обновить</button></div>`;

  let body="";
  if(state.leaderTab==="orders"){
    body = orders.length ? orders.slice().reverse().map(o=>{
      const s=STATUS[o.st];
      const btn = o.st==="ready" ? `<button class="btn" data-give="${o.id}" ${dis}>Выдал</button>` : "";
      return `<div class="order">
        <div class="order-top"><b>${esc(o.who)}</b><span class="pill ${s.c}">${s.t}</span></div>
        ${o.phone?`<div class="items">${esc(o.phone)}</div>`:""}
        <div class="items">${Object.entries(o.items||{}).map(([id,q])=>`${esc(pName(id))} ×${q}`).join(", ")}</div>
        <div class="bot"><span>№${o.id} · <b>${fmt(o.total)}</b></span>${btn}</div>
      </div>`}).join("") : `<div class="empty"><h3>Пока нет заказов</h3><p class="muted">Отправьте ссылку-приглашение в чат дома.</p></div>`;
    body += `<button class="btn ghost block" data-act="ordfor">+ Оформить заказ за соседа</button>`;
  } else if(state.leaderTab==="summary"){
    const agg={}; orders.filter(o=>o.st!=="done").forEach(o=>Object.entries(o.items||{}).forEach(([id,q])=>agg[id]=(agg[id]||0)+q));
    const rows=Object.entries(agg).sort((a,b)=>b[1]-a[1]);
    body = rows.length ? `<div class="panel" style="padding-block:4px">${rows.map(([id,q])=>{const p=prod(id)||{weight:"",price:0};return `<div class="line">
      <div class="mini" style="${tile(p)}">${esc(p.weight)}</div><div class="grow"><div class="name">${esc(pName(id))}</div><div class="muted" style="font-size:13px">${fmt(p.price*q)}</div></div><b style="font-size:18px;font-variant-numeric:tabular-nums">×${q}</b></div>`}).join("")}</div>
      <p class="muted" style="margin:0;font-size:13px">По этой сводке мы закупаем и собираем коробки для вашего ЖК.</p>` : `<div class="empty"><p class="muted">Нет невыданных заказов.</p></div>`;
  } else {
    body = `<div class="panel">
      <div class="sum-row"><span>Текущий сбор · ${orders.length} заказов</span><b>${fmt(sumAll*COMMISSION)}</b></div>
      ${history.map(h=>`<div class="sum-row"><span class="muted">${new Date(h.d).toLocaleDateString("ru-RU",{day:"numeric",month:"long"})} · ${h.n} заказов</span><span>${fmt(h.sum*COMMISSION)}</span></div>`).join("")}
      <div class="sum-row total"><span>За 60 дней</span><span>${fmt((sumAll+history.reduce((s,h)=>s+(+h.sum),0))*COMMISSION)}</span></div>
    </div>
    <p class="muted" style="margin:0;font-size:13px">Вы получаете ${Math.round(COMMISSION*100)}% от суммы выданных заказов.</p>`;
  }
  const invite = location.origin + location.pathname + "?zk=" + encodeURIComponent(z.id);
  return `<section class="section wrap">
    <div class="hero-l">
      <div style="display:flex;justify-content:space-between;gap:10px;align-items:flex-start"><div style="min-width:0"><span style="font-size:13px;opacity:.85">Кабинет лидера${z.flats?" · "+esc(z.flats):""}</span><h2 style="margin-top:2px">${esc(z.leader_name)}, ${esc(z.name)}</h2></div><button class="logout" data-act="logout">Выйти</button></div>
      <div class="stats">
        <div class="s"><b>${orders.length}</b><small>заказов в сборе</small></div>
        <div class="s"><b>${(sumAll/1000).toFixed(1).replace(".",",")}к</b><small>сумма, ₸</small></div>
        <div class="s"><b>${fmt(sumAll*COMMISSION).replace(" ₸","")}</b><small>ваш доход, ₸</small></div>
      </div>
      <div class="invite"><code id="inviteLink">${esc(invite)}</code><button data-act="copy">Копировать</button></div>
    </div>
    <div class="panel">
      <div class="progress">${stages.map((_,i)=>`<i class="${i<=stageIdx?"on":""}"></i>`).join("")}</div>
      <div class="stage">${stages.map((s,i)=>`<span class="${i===stageIdx?"cur":""}">${s}</span>`).join("")}</div>
      ${action}
    </div>
    ${tabs}
    ${body}
  </section>`;
}

      <div class="steps">
        ${[["Сегодня","Менеджер позвонит","Расскажет об условиях и ответит на вопросы."],
           ["1–2 дня","Проверим ЖК и место выдачи","Убедимся, что машина может подъехать, а заказы есть где хранить пару часов."],
           ["Онлайн","Подпишем агентский договор","Через телефон, без визита в офис. Поможем оформить самозанятость."],
           ["Старт","Получите код доступа","Войдёте в кабинет, отправите ссылку в чат дома, и соседи начнут заказывать."]]
          .map((s,i)=>`<div class="step"><div class="n">${i+1}</div><div><span class="time">${s[0]}</span><div class="t">${s[1]}</div><div class="muted">${s[2]}</div></div></div>`).join("")}
      </div>
    </div>
    <button class="btn ghost block" data-act="tologin">У меня есть код доступа</button>
  </section>`;
}

/* ---------- render & data ---------- */
function render(){
  $("#zkName").textContent=zk().name;
  let html;
  if(state.view==="done"&&doneOrder) html=viewDone(doneOrder);
  else html={shop:viewShop,cart:viewCart,how:viewHow,leader:viewLeader}[state.view]();
  $("#view").innerHTML=html;
  const nav=state.view==="done"?"cart":state.view;
  document.querySelectorAll(".nav button").forEach(b=>b.setAttribute("aria-current",b.dataset.go===nav?"page":"false"));
  const c=cartCount(); const bd=$("#cartBadge"); bd.hidden=!c; bd.textContent=c;
  $("#deadline").hidden = state.view==="leader";
}
function go(v){
  state.view=v; if(location.hash!=="#"+v && v!=="done") history.replaceState(null,"",location.pathname+location.search+"#"+v);
  if(v==="leader" && state.leader && !state.ld) loadLeader();
  render(); window.scrollTo(0,0);
}

async function loadCatalog(){
  state.loading=true; state.loadError=null; render();
  try{
    const [zks, prods] = await Promise.all([
      api("adal_zk?select=id,name,leader_name,flats,city&active=eq.true&order=name"),
      api("adal_products?select=id,cat,brand,name,variant,weight,price,old_price,color,color2&active=eq.true&order=sort")
    ]);
    ZKS=zks; PRODUCTS=prods;
    if(!ZKS.some(z=>z.id===state.zk) && ZKS[0]) state.zk=ZKS[0].id;
    for(const id of Object.keys(state.cart)) if(!prod(id)) delete state.cart[id];
    saveCart();
  }catch(e){ state.loadError=e.message; }
  state.loading=false; render();
}

async function loadLeader(){
  if(!state.leader) return;
  state.ldError=null;
  try{
    const d = await rpc("adal_leader_data",{p_zk:state.leader.zk, p_code:state.leader.code});
    if(d && d.error){ state.ld=null; state.ldError=d.error; if(/Неверный код/.test(d.error)){ state.leader=null; ss.del("adal-leader"); state.leaderMode="login"; toast(d.error); } }
    else state.ld=d;
  }catch(e){ state.ldError=e.message; }
  render();
}
async function leaderAction(action, order){
  state.busy=true; render();
  try{
    const r = await rpc("adal_leader_action",{p_zk:state.leader.zk, p_code:state.leader.code, p_action:action, p_order:order??null});
    if(r && r.error) toast(r.error);
    else toast({close:"Сбор закрыт, сводка ушла в ADAL", arrive:"Отмечено: заказы привезли", give:"Отмечено: заказ выдан", newround:"Новый сбор открыт"}[action]);
  }catch(e){ toast(e.message); }
  state.busy=false; await loadLeader();
}

document.addEventListener("click",e=>{
  const t=e.target.closest("button"); if(!t) return;
  const d=t.dataset;
  if(d.go){ go(d.go); return; }
  if(d.add){ state.cart[d.add]=Math.min(50,(state.cart[d.add]||0)+1); saveCart(); render(); return; }
  if(d.dec){ state.cart[d.dec]--; if(state.cart[d.dec]<=0) delete state.cart[d.dec]; saveCart(); render(); return; }
  if(d.cat){ state.cat=d.cat; render(); return; }
  if(d.ltab){ state.leaderTab=d.ltab; render(); return; }
  if(d.give){ leaderAction("give", +d.give); return; }
  if(d.pay){ state.reg.pay=d.pay; document.querySelectorAll("[data-pay]").forEach(b=>b.setAttribute("aria-pressed",b.dataset.pay===d.pay)); return; }
  if(d.act==="reload"){ loadCatalog(); return; }
  if(d.act==="becomeleader"){ state.leaderMode="reg"; state.regDone=false; go("leader"); return; }
  if(d.act==="tologin"){ state.leaderMode="login"; go("leader"); return; }
  if(d.act==="logout"){ state.leader=null; state.ld=null; state.ldError=null; ss.del("adal-leader"); state.leaderMode="login"; go("leader"); return; }
  if(d.act==="loadleader"){ loadLeader(); return; }
  if(d.act==="ordfor"){ if(state.ld) state.zk=state.ld.zk.id; go("shop"); return; }
  if(["close","arrive","newround"].includes(d.act)){ leaderAction(d.act); return; }
  if(d.act==="copy"){ const txt=$("#inviteLink").textContent;
    const done=()=>toast("Ссылка скопирована, отправьте её в чат дома");
    try{ navigator.clipboard.writeText(txt).then(done,()=>{selectInvite();toast("Выделил ссылку, скопируйте её вручную")}); }catch(_){ selectInvite(); }
    return; }
  if(t.id==="zkBtn"){ openZk(); return; }
});
function selectInvite(){ const r=document.createRange(); r.selectNodeContents($("#inviteLink")); const s=getSelection(); s.removeAllRanges(); s.addRange(r); }

document.addEventListener("change",e=>{ if(e.target.id==="f-zk"){ state.zk=e.target.value; ss.set("adal-zk",state.zk); $("#zkName").textContent=zk().name; }});

document.addEventListener("submit",async e=>{
  const id=e.target.id; if(!["checkout","regForm","loginForm"].includes(id)) return;
  e.preventDefault(); if(state.busy) return;

  if(id==="checkout"){
    const name=$("#f-name").value.trim(), apt=$("#f-apt").value.trim().replace(/^кв\.?\s*/i,""), phone=$("#f-phone").value.trim();
    const err=$("#formErr");
    if(!name||!apt){ err.textContent="Укажите имя и номер квартиры, чтобы лидер знал, кому отдать заказ."; err.hidden=false; return; }
    state.zk=$("#f-zk").value; ss.set("adal-zk",state.zk);
    const keep={name,apt,phone}; state.busy=true; render(); $("#f-name").value=keep.name; $("#f-apt").value=keep.apt; $("#f-phone").value=keep.phone;
    try{
      const r = await rpc("adal_place_order",{p_zk:state.zk, p_name:name, p_apt:apt, p_phone:phone||null, p_items:state.cart});
      const z=zk();
      doneOrder={...r, zkName:z.name, leader:z.leader_name};
      state.cart={}; saveCart(); state.busy=false; state.ld=null; go("done");
    }catch(ex){
      state.busy=false; render(); $("#f-name").value=keep.name; $("#f-apt").value=keep.apt; $("#f-phone").value=keep.phone;
      const er=$("#formErr"); er.textContent="Не получилось оформить заказ: "+ex.message; er.hidden=false;
    }
    return;
  }

  if(id==="loginForm"){
    const z=$("#l-zk").value, code=$("#l-code").value.trim(), err=$("#loginErr");
    if(!code){ err.textContent="Введите код доступа."; err.hidden=false; return; }
    state.busy=true; render();
    try{
      const d = await rpc("adal_leader_data",{p_zk:z, p_code:code});
      state.busy=false;
      if(d && d.error){ render(); $("#l-zk").value=z; const er=$("#loginErr"); er.textContent=d.error; er.hidden=false; return; }
      state.leader={zk:z, code}; ss.set("adal-leader", state.leader); state.ld=d; state.leaderTab="orders"; render();
    }catch(ex){ state.busy=false; render(); const er=$("#loginErr"); er.textContent=ex.message; er.hidden=false; }
    return;
  }

  if(id==="regForm"){
    const r=state.reg, errs=[], bad=[];
    if(r.name.trim().length<2){ errs.push("имя"); bad.push("r-name"); }
    if(r.phone.replace(/\D/g,"").length<10){ errs.push("телефон (10–11 цифр)"); bad.push("r-phone"); }
    if(!r.zk.trim()){ errs.push("название ЖК"); bad.push("r-zk"); }
    const box=$("#regErr");
    bad.forEach(i=>$("#"+i).classList.add("bad"));
    if(errs.length){ box.textContent="Заполните: "+errs.join(", ")+"."; box.hidden=false; $("#"+bad[0]).focus(); return; }
    if(!r.agree){ box.textContent="Отметьте согласие с условиями, чтобы отправить заявку."; box.hidden=false; return; }
    state.busy=true; render();
    try{
      await rpc("adal_submit_application",{p:{...r, name:r.name.trim(), zk:r.zk.trim()}});
      state.busy=false; state.regDone=true; render(); window.scrollTo(0,0);
    }catch(ex){ state.busy=false; render(); const b=$("#regErr"); b.textContent="Не получилось отправить заявку: "+ex.message; b.hidden=false; }
  }
});

document.addEventListener("input",e=>{
  const t=e.target;
  if(t.id==="calc"){ state.calc=+t.value; $("#calcN").textContent=t.value; $("#calcOut").textContent="≈ "+fmt(calcIncome(+t.value)); return; }
  if(t.dataset.reg){ state.reg[t.dataset.reg]= t.type==="checkbox" ? t.checked : t.value; t.classList.remove("bad"); }
});

function openZk(){
  if(!ZKS.length) return;
  const bg=document.createElement("div"); bg.className="sheet-bg";
  bg.innerHTML=`<div class="sheet" role="dialog" aria-label="Выбор ЖК"><h2>Ваш жилой комплекс</h2>
    <p class="muted" style="margin:0">Заказ привезут лидеру выбранного ЖК.</p>
    ${ZKS.map(z=>`<button class="opt" data-zk="${esc(z.id)}" aria-pressed="${z.id===state.zk}"><span><b>${esc(z.name)}</b><br><span class="muted" style="font-size:13px">Лидер: ${esc(z.leader_name)}${z.flats?" · "+esc(z.flats):""}</span></span>${z.id===state.zk?"✓":""}</button>`).join("")}
    <button class="btn ghost block" data-close>Закрыть</button></div>`;
  bg.addEventListener("click",ev=>{
    const b=ev.target.closest("[data-zk]");
    if(b){ state.zk=b.dataset.zk; ss.set("adal-zk",state.zk); render(); bg.remove(); toast("ЖК выбран: "+zk().name); ev.stopPropagation(); return; }
    if(ev.target===bg||ev.target.closest("[data-close]")){ bg.remove(); ev.stopPropagation(); }
  });
  document.body.appendChild(bg); bg.querySelector(".opt").focus();
}

function tick(){
  const now=new Date(), end=new Date(now); end.setHours(21,0,0,0);
  if(now>=end) end.setDate(end.getDate()+1);
  const s=Math.floor((end-now)/1000), p=n=>String(n).padStart(2,"0");
  $("#cd").textContent=`${p(Math.floor(s/3600))}:${p(Math.floor(s%3600/60))}:${p(s%60)}`;
}
setInterval(tick,1000); tick();

const VIEWS=["shop","cart","how","leader"];
window.addEventListener("hashchange",()=>{ const h=location.hash.slice(1); if(VIEWS.includes(h)) go(h); });
(function boot(){
  const q=new URLSearchParams(location.search).get("zk");
  if(q){ state.zk=q; ss.set("adal-zk",q); }
  const h=location.hash.slice(1); if(VIEWS.includes(h)) state.view=h;
  if(state.leader) state.leaderMode="login";
  loadCatalog().then(()=>{ if(state.view==="leader" && state.leader) loadLeader(); });
})();
</script>

</body>
</html>
