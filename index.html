<style>
/* Layout: phone app shell (max 480px), sticky top bar, fixed bottom tabs; views — Магазин, Корзина, Как это работает */
:root{
  --bg:#F3F6F5; --surface:#FFFFFF; --ink:#0E2B2C; --muted:#5D7273; --line:#DCE5E3;
  --brand:#0F4C4A; --brand-ink:#FFFFFF; --accent:#E9A23B; --accent-soft:#FBEBD2;
  --ok:#2E8B57; --ok-soft:#DDF1E5; --warn:#B7701A; --info:#2F6FB0; --info-soft:#DDE9F6;
  --font-display:"Onest", system-ui, sans-serif;
  --font-logo:"Unbounded", "Onest", system-ui, sans-serif;
  --font-body:"Onest", system-ui, -apple-system, "Segoe UI", sans-serif;
  --r:14px;
}

*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:15px;line-height:1.45}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible,a:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.app{max-width:480px;margin:0 auto;min-height:100vh;padding-bottom:calc(84px + env(safe-area-inset-bottom,0px))}
.wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--brand)}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--brand);color:var(--brand-ink);padding-block:12px}
.top-row{display:flex;align-items:center;justify-content:space-between;gap:12px}
.logo{display:flex;align-items:center;gap:8px;font-family:var(--font-logo);font-weight:700;font-size:20px;letter-spacing:-.01em;line-height:1;color:#fff}
.logo svg{flex:none;display:block}
.logo small{font-family:var(--font-body);font-weight:600;font-size:14px;letter-spacing:.01em;opacity:.7;margin-left:4px}
.zk{display:flex;align-items:center;gap:6px;background:color-mix(in srgb,var(--brand-ink) 14%,transparent);border:0;border-radius:999px;padding:6px 12px;font-size:13px;font-weight:600;color:var(--brand-ink);max-width:60%}
.zk span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.deadline{margin-top:10px;display:flex;gap:10px;align-items:center;background:var(--accent);color:#2A1A03;border-radius:10px;padding:8px 12px;font-size:13px;font-weight:600}
.deadline b{font-variant-numeric:tabular-nums;font-size:15px}

h1,h2,h3{font-family:var(--font-display);font-weight:700;text-wrap:balance;margin:0}
h1{font-size:22px;line-height:1.2} h2{font-size:17px} h3{font-size:15px}
.muted{color:var(--muted)}
.section{display:flex;flex-direction:column;gap:14px;padding-block:18px}
.label{font-size:11px;text-transform:uppercase;letter-spacing:.08em;font-weight:700;color:var(--muted)}

.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.chip{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 14px;font-size:13px;font-weight:600}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}

.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px;display:flex;flex-direction:column;gap:8px;min-width:0}
.thumb{aspect-ratio:4/3;max-width:100%;border-radius:10px;display:flex;flex-direction:column;justify-content:space-between;padding:10px;color:#fff}
.thumb .w{font-family:var(--font-display);font-size:22px;font-weight:700;line-height:1}
.thumb .c{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;opacity:.9}
.thumb .br{display:block;font-family:var(--font-display);font-size:22px;font-weight:700;line-height:1.05;text-shadow:0 1px 2px rgba(0,0,0,.25)}
.thumb .v{display:block;font-size:12px;font-weight:700;opacity:.95;margin-top:2px}
.thumb .w{font-size:15px;align-self:flex-start;background:rgba(0,0,0,.22);padding:3px 8px;border-radius:6px}
.err{background:var(--accent-soft);color:var(--warn);border-radius:10px;padding:10px 12px;font-size:13px;font-weight:600;margin:0}
.photo{position:relative;aspect-ratio:4/5;max-width:100%;border-radius:10px;overflow:hidden}
.photo img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;background:#F3F5F4}
.photo .w{position:absolute;left:8px;top:8px;background:rgba(14,43,44,.82);color:#fff;font-weight:800;font-size:13px;padding:3px 8px;border-radius:6px}
.line .mini{position:relative;overflow:hidden}
.line .mini img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;background:#F3F5F4}
.skel .photo{background:var(--line)}
.skel .thumb{background:var(--line)}
.sk{height:12px;border-radius:6px;background:var(--line)}
.sk.short{width:60%}
.c-groc{background:linear-gradient(140deg,#B9802F,#8A5A1B)}
.c-oil{background:linear-gradient(140deg,#C49A1E,#8F6C0C)}
.c-can{background:linear-gradient(140deg,#A0453B,#6E2A23)}
.c-tea{background:linear-gradient(140deg,#3E7A55,#245038)}
.c-home{background:linear-gradient(140deg,#3E6FA3,#24476F)}
.name{font-weight:700;font-size:14px;line-height:1.25}
.price-row{display:flex;align-items:baseline;gap:6px;flex-wrap:wrap}
.price{font-weight:800;font-size:16px;font-variant-numeric:tabular-nums}
.old{color:var(--muted);text-decoration:line-through;font-size:12px;font-variant-numeric:tabular-nums}
.save{font-size:11px;font-weight:800;color:var(--ok);background:var(--ok-soft);padding:2px 6px;border-radius:6px}
.btn{border:0;border-radius:10px;padding:10px 14px;font-weight:700;background:var(--brand);color:var(--brand-ink)}
.btn.block{width:100%;padding:14px;font-size:16px}
.btn.ghost{background:transparent;border:1.5px solid var(--line);color:var(--ink)}
.btn.accent{background:var(--accent);color:#2A1A03}
.btn:disabled{opacity:.45;cursor:not-allowed}
.qty{display:flex;align-items:center;justify-content:space-between;border:1.5px solid var(--brand);border-radius:10px;overflow:hidden}
.qty button{border:0;background:transparent;width:38px;height:38px;font-size:20px;font-weight:700;color:var(--brand)}
.qty span{font-weight:800;font-variant-numeric:tabular-nums}

.line{display:flex;gap:12px;align-items:center;padding-block:12px;border-bottom:1px solid var(--line)}
.line:last-child{border-bottom:0}
.line .mini{width:52px;height:52px;flex:none;border-radius:10px;display:flex;align-items:center;justify-content:center;color:#fff;font-family:var(--font-display);font-size:12px;font-weight:700;text-align:center}
.line .grow{flex:1;min-width:0}
.line .qty{width:112px;flex:none}
.sum-row{display:flex;justify-content:space-between;gap:12px;font-variant-numeric:tabular-nums}
.sum-row.total{font-weight:800;font-size:18px;padding-top:8px;border-top:1px solid var(--line)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;display:flex;flex-direction:column;gap:10px}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:13px;font-weight:700}
.field input,.field select{border:1.5px solid var(--line);background:var(--bg);border-radius:10px;padding:12px;font:inherit;color:var(--ink);width:100%}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.note{background:var(--accent-soft);border-radius:12px;padding:12px 14px;font-size:13px}
.empty{text-align:center;padding:40px 16px;display:flex;flex-direction:column;gap:12px;align-items:center}

/* how it works */
.steps{display:flex;flex-direction:column;gap:0}
.step{display:grid;grid-template-columns:40px 1fr;gap:12px;position:relative;padding-bottom:18px}
.step:not(:last-child)::before{content:"";position:absolute;left:19px;top:40px;bottom:0;width:2px;background:var(--line)}
.step .n{width:40px;height:40px;border-radius:50%;background:var(--brand);color:var(--brand-ink);display:flex;align-items:center;justify-content:center;font-family:var(--font-display);font-weight:700}
.step .t{font-weight:800}
.step .time{display:inline-block;font-size:12px;font-weight:700;color:var(--warn);margin-bottom:2px}
.compare{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.compare .panel{gap:6px}
.big{font-family:var(--font-display);font-size:22px;font-weight:700;font-variant-numeric:tabular-nums}
.who{display:grid;grid-template-columns:1fr;gap:10px}

/* leader */
.hero-l{background:var(--brand);color:var(--brand-ink);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:12px}
.hero-l .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.hero-l .s{background:color-mix(in srgb,var(--brand-ink) 12%,transparent);border-radius:10px;padding:10px}
.hero-l .s b{display:block;font-family:var(--font-display);font-size:17px;font-variant-numeric:tabular-nums}
.hero-l .s small{font-size:11px;opacity:.85}
.invite{display:flex;gap:8px;align-items:center;background:color-mix(in srgb,var(--brand-ink) 12%,transparent);border-radius:10px;padding:8px 8px 8px 12px}
.invite code{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:13px}
.invite button{border:0;background:var(--accent);color:#2A1A03;border-radius:8px;padding:8px 12px;font-weight:700;font-size:13px}
.progress{display:flex;gap:4px}
.progress i{flex:1;height:6px;border-radius:3px;background:var(--line)}
.progress i.on{background:var(--brand)}
.stage{display:flex;justify-content:space-between;font-size:11px;font-weight:700;color:var(--muted);gap:4px}
.stage .cur{color:var(--brand)}
.order{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:6px}
.order-top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.pill{font-size:11px;font-weight:800;padding:3px 8px;border-radius:999px;white-space:nowrap}
.p-paid{background:var(--info-soft);color:var(--info)}
.p-sent{background:var(--accent-soft);color:var(--warn)}
.p-ready{background:var(--ok-soft);color:var(--ok)}
.p-done{background:var(--line);color:var(--muted)}
.order .items{font-size:13px;color:var(--muted)}
.order .bot{display:flex;justify-content:space-between;align-items:center;gap:8px;font-variant-numeric:tabular-nums}
.order .bot .btn{padding:7px 12px;font-size:13px}
.new{animation:flash 1.6s ease-out}
@keyframes flash{from{box-shadow:0 0 0 3px var(--accent)}to{box-shadow:0 0 0 0 transparent}}
.tabs-l{display:flex;gap:8px}

/* bottom nav */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
.nav-in{max-width:480px;margin:0 auto;display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr)}
.nav button{border:0;background:transparent;padding:10px 4px 12px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;font-weight:700;color:var(--muted);position:relative}
.nav button[aria-current="page"]{color:var(--brand)}
.nav svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.badge{position:absolute;top:5px;left:calc(50% + 6px);background:var(--accent);color:#2A1A03;border-radius:999px;font-size:10px;font-weight:800;min-width:18px;height:18px;padding:0 5px;display:flex;align-items:center;justify-content:center}
.toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-weight:700;font-size:14px;z-index:20;max-width:calc(100% - 32px)}
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:30;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:480px;border-radius:18px 18px 0 0;padding:20px max(16px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:10px}
.opt{display:flex;justify-content:space-between;align-items:center;gap:10px;border:1.5px solid var(--line);background:var(--bg);border-radius:12px;padding:12px 14px;text-align:left}
.opt[aria-pressed="true"]{border-color:var(--brand)}
.demo{font-size:12px;color:var(--muted);text-align:center;padding-block:4px 10px}
.reg-hero{background:var(--brand);color:var(--brand-ink);border-radius:var(--r);padding:18px 16px;display:flex;flex-direction:column;gap:10px}
.calc{background:color-mix(in srgb,var(--brand-ink) 12%,transparent);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:8px;font-size:14px}
.calc input{width:100%;accent-color:var(--accent)}
.calc-out{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
.calc-out b{font-family:var(--font-display);font-size:20px;color:var(--accent);font-variant-numeric:tabular-nums}
.calc small{opacity:.8;font-size:12px}
.duties{display:grid;gap:8px}
.duty{display:flex;flex-direction:column;gap:2px;padding:12px 14px;border-left:3px solid var(--accent);background:var(--surface);border-radius:0 10px 10px 0}
.flabel{font-size:13px;font-weight:700}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.seg button{border:1.5px solid var(--line);background:var(--bg);border-radius:10px;padding:10px 4px;font-size:13px;font-weight:700}
.seg button[aria-pressed="true"]{border-color:var(--brand);background:var(--brand);color:var(--brand-ink)}
.check{display:flex;gap:10px;align-items:flex-start;font-size:13px}
.check input{width:20px;height:20px;flex:none;margin:0;accent-color:var(--brand)}
.err{background:var(--accent-soft);color:var(--warn);border-radius:10px;padding:10px 12px;font-size:13px;font-weight:600}
.field input.bad,.field select.bad{border-color:var(--warn)}
.logout{border:0;background:color-mix(in srgb,var(--brand-ink) 14%,transparent);color:var(--brand-ink);border-radius:8px;padding:6px 10px;font-size:12px;font-weight:700;flex:none}
@media (prefers-reduced-motion:reduce){.new{animation:none}}
/* ===== redesign: светлая шапка, чистые карточки, плавающая корзина ===== */
:root{--bg:#F4F6F5;--shadow:0 1px 2px rgba(14,43,44,.06),0 4px 14px rgba(14,43,44,.06);--r:18px}
h1,h2{font-family:var(--font-body);font-weight:800;letter-spacing:-.02em}
h1{font-size:24px;line-height:1.15} h2{font-size:19px}
body::before{background:var(--surface)}
.top{background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:saturate(1.4) blur(12px);-webkit-backdrop-filter:saturate(1.4) blur(12px);color:var(--ink);padding-block:10px 10px;border-bottom:1px solid var(--line)}
.logo{color:var(--ink)}
.logo .h1{fill:var(--brand)}
.logo small{opacity:.55}
.zk{background:var(--bg);color:var(--ink);padding:6px 10px 6px 14px;border-radius:14px;text-align:left;gap:6px}
.zk-txt{display:flex;flex-direction:column;min-width:0;line-height:1.15}
.zk-txt small{font-size:11px;font-weight:600;color:var(--muted)}
.zk-txt span{font-weight:800;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.deadline{margin-top:8px;background:transparent;color:var(--muted);padding:0;font-size:13px;font-weight:600;gap:8px}
.deadline .dot{width:8px;height:8px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 4px var(--ok-soft);flex:none}
.deadline b{margin-left:auto;color:var(--ink);background:var(--bg);padding:3px 8px;border-radius:8px;font-size:13px}
.section{gap:16px;padding-block:16px}
.promo{position:relative;overflow:hidden;background:var(--brand);color:var(--brand-ink);border-radius:22px;padding:20px 18px;display:flex;align-items:flex-end;gap:10px;min-height:132px}
.promo h1{font-size:22px;color:inherit;max-width:13ch}
.promo p{margin:8px 0 0;font-size:13.5px;opacity:.85;max-width:25ch}
.promo-art{position:absolute;right:-8px;bottom:-8px;width:88px;height:auto;opacity:.9}
.promo>div{position:relative;z-index:1}
.chip{border:0;background:var(--surface);box-shadow:var(--shadow);padding:9px 16px;font-weight:700}
.chips{padding:2px 2px 6px;margin:-2px -2px 0}
.grid{gap:12px}
.card{border:0;box-shadow:var(--shadow);padding:0;gap:0;overflow:hidden;border-radius:var(--r)}
.card .photo{border-radius:0;aspect-ratio:1/1.08}
.card .photo img{object-fit:cover}
.photo .w{background:rgba(255,255,255,.92);color:#0E2B2C;font-size:12px;top:10px;left:10px;border-radius:8px;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.ctl{position:absolute;right:10px;bottom:10px}

function t(s){
  if(LANG!=="kk"||!s) return s;
  const k=String(s).replace(/ /g," ").trim();
  if(KK[k]) return KK[k];
  for(const [re,r] of KK_RE){ if(re.test(k)) return k.replace(re,r); }
  return s;
}
function tName(p){ return (LANG==="kk" && p.name_kk) ? p.name_kk : p.name; }
function translateDom(root){
  const w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT,{acceptNode:n=>/^(SCRIPT|STYLE)$/.test(n.parentNode.nodeName)?NodeFilter.FILTER_REJECT:NodeFilter.FILTER_ACCEPT});
  const nodes=[]; while(w.nextNode()) nodes.push(w.currentNode);
  for(const n of nodes){
    if(n._ru===undefined) n._ru=n.nodeValue;
    const src=n._ru, core=src.trim();
    if(!core){ continue; }
    const out = LANG==="kk" ? t(core) : core;
    const lead=src.slice(0,src.indexOf(core)), tail=src.slice(src.indexOf(core)+core.length);
    const nv = out===core ? src : lead+out+tail;
    if(n.nodeValue!==nv) n.nodeValue=nv;
  }
  root.querySelectorAll("[placeholder],[aria-label],[title]").forEach(el=>{
    if(el.id==="langBtn") return;
    for(const a of ["placeholder","aria-label","title"]){
      if(!el.hasAttribute(a)) continue;
      const k="_ru_"+a; if(el[k]===undefined) el[k]=el.getAttribute(a);
      const nv = LANG==="kk" ? t(el[k]) : el[k]; if(el.getAttribute(a)!==nv) el.setAttribute(a,nv);
    }
  });
  const lb=document.getElementById("langBtn"); if(lb){ lb.textContent = LANG==="kk" ? "РУС" : "ҚАЗ"; lb.setAttribute("aria-label", LANG==="kk"?"Выбрать язык: русский":"Тілді таңдау: қазақша"); }
  document.documentElement.lang = LANG==="kk" ? "kk" : "ru";
}

function toast(msg){
  const el=document.createElement("div"); el.className="toast"; el.textContent=t(msg); el.setAttribute("role","status");

}

  try{ navigator.clipboard.writeText(txt).then(done,()=>toast("Не удалось скопировать: "+txt)); }catch(_){ toast("Не удалось скопировать: "+txt); }
}

/* ---------- общие блоки ---------- */
function collectCard(z, sum, title, toWhom){
  const thr=SET.threshold, left=Math.max(0,thr-sum), pct=thr?Math.min(100,sum/thr*100):100;
  return `<section class="collect ${left?"":"ok"}">
    <b style="font-size:16px">${title||"Сбор вашего дома"}</b>
    <div><span class="big">${fmt(sum)}</span> <span style="opacity:.85">из ${fmt(thr)}</span></div>
    <div class="bar" role="progressbar" aria-valuemin="0" aria-valuemax="${thr}" aria-valuenow="${Math.round(sum)}"><i style="width:${pct}%"></i></div>
    <span class="sub">${(()=>{ const who = toWhom || (z.leader_name?"лидеру "+esc(z.leader_name):"лидеру"); return left?`Ещё ${fmt(left)} — и мы привезём заказы дома ${who}`:`Сбор набран: закупаем и везём заказы дома ${who}`; })()}</span>
  </section>`;
}
function payBlock(total){
  return `<section class="panel">
    <h2>Оплата</h2>
    <p class="muted" style="margin:0">Когда будете забирать заказ у лидера, переведите ${total?`<b>${fmt(total)}</b> `:""}на Kaspi Bereke store. Наличные не принимаем.</p>

      :`<div class="kaspi"><span class="muted">Реквизиты Kaspi появятся здесь</span></div>`}

}
function stageBar(st){
  const i = STAGE_OF[st] ?? 0, names=["Сбор","В пути","Привезли","Выдан"];
  return `<div class="progress">${names.map((_,k)=>`<i class="${k<=i?"on":""}"></i>`).join("")}</div>
    <div class="stage">${names.map((n,k)=>`<span class="${k===i?"cur":""}">${n}</span>`).join("")}</div>`;

/* ---------- витрина ---------- */
function cardCtl(id){
  const q=state.cart[id]||0;
  if(!q) return `<button class="plus" data-add="${id}" aria-label="Добавить в корзину"><svg viewBox="0 0 24 24" width="22" height="22"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"/></svg></button>`;
  return `<div class="pill-q"><button data-dec="${id}" aria-label="Меньше">−</button><span>${q}</span><button data-add="${id}" aria-label="Больше">+</button></div>`;
}

const norm = x => String(x||"").toLowerCase().replace(/ё/g,"е");
function filterList(){
  const q=norm(state.q).trim();
  if(!q) return PRODUCTS.filter(p=>state.cat==="all"||p.cat===state.cat);
  return PRODUCTS.filter(p=>norm([p.name,p.name_kk,p.brand,p.variant,p.weight,CATS[p.cat],t(CATS[p.cat])].join(" ")).includes(q));
}
function tipList(){
  const z=zk(), sum=pool(z.id), left=Math.max(0,SET.threshold-sum), c=cartSum(), o=cartOld();
  const link=leaderLink(z), txt="Покупаем продукты вместе с соседями — дешевле! Заходи:";
  const share=`https://t.me/share/url?url=${encodeURIComponent(link)}&text=${encodeURIComponent(txt)}`;
  return [
    left ? {pose:"wave",text:`Привет, я Ирби! Дому не хватает ${fmt(left)} до машины. Позови соседей — вместе дешевле!`,btn:["Позвать соседей",`data-ext="${esc(share)}"`]}
         : {pose:"wave",text:"Привет, я Ирби! Сбор дома набран — скоро привезём заказы лидеру."},
    {pose:"bag",text:"Закажи до 21:00, а завтра лидер получит машину. Платить сразу не нужно — переведёшь на Kaspi при получении."},
    (o>c && c) ? {pose:"point",text:`Ты уже экономишь ${fmt(o-c)} в корзине. Так держать!`} : {pose:"point",text:"Нажми на фото товара — там состав и срок годности."},
    {pose:"wave",text:`Хочешь зарабатывать ${Math.round(SET.commission)}% с заказов дома? Стань лидером ЖК!`,btn:["Стать лидером",'data-act="becomeleader"']}
  ];
}
const tipHtml = k => `<div class="tip"><img class="irbi" src="img/irbi-${k.pose}.svg" alt="" width="88" height="96" loading="lazy"><div class="bub"><b>Ирби</b><span>${esc(k.text)}</span>${k.btn?`<button class="btn light" ${k.btn[1]}>${k.btn[0]}</button>`:""}</div></div>`;
let tipObs=null;
function observeTips(){
  const els=document.querySelectorAll(".tip:not(.in)");
  if(!("IntersectionObserver" in window)){ els.forEach(e=>e.classList.add("in")); return; }
  if(!tipObs) tipObs=new IntersectionObserver(es=>es.forEach(en=>{ if(en.isIntersecting){ en.target.classList.add("in"); tipObs.unobserve(en.target); } }),{threshold:.35});
  els.forEach(e=>tipObs.observe(e));
}
function gridHtml(list){
  if(!list.length) return `<div class="nores"><b>Ничего не найдено</b><span class="muted">Попробуйте другое слово или выберите категорию.</span><button class="btn light" data-qclear>Сбросить</button></div>`;
  const tips = state.q.trim() ? [] : tipList();
  const cards = list.map(p=>`<article class="card ${state.cart[p.id]?"in":""}">
        <div class="photo" style="${tile(p)}" data-open="${p.id}">
          <img src="${imgOf(p)}" alt="${esc(tName(p))}${p.variant?" "+esc(p.variant):""}" loading="lazy" onerror="this.remove()">
          <span class="w">${esc(p.weight)}</span>
          <div class="ctl">${cardCtl(p.id)}</div>
        </div>
        <div class="body">
          <div class="price-row"><span class="price">${fmt(p.price)}</span>${p.old_price?`<span class="old">${fmt(p.old_price)}</span><span class="save">−${Math.round((1-p.price/p.old_price)*100)}%</span>`:""}</div>
          <div class="name" data-open="${p.id}">${esc(tName(p))}</div>
          ${p.variant?`<div class="variant">${esc(p.variant)}</div>`:""}
        </div>
      </article>`);
  const out=[]; let ti=0;
  cards.forEach((c,i)=>{ out.push(c); if(i>=3 && (i-3)%8===0 && ti<tips.length && i<cards.length-1) out.push(tipHtml(tips[ti++])); });
  return `<div class="grid">${out.join("")}</div>`;
}

function productSheet(p){
  const q=state.cart[p.id]||0, live=!SET.prelaunch;
  const save = p.old_price && p.old_price>p.price ? p.old_price-p.price : 0;
  const rows=[["Состав",p.composition],["Срок годности",p.shelf],["Хранение",p.storage],["О товаре",p.descr]].filter(r=>r[1]);
  return `<div class="sheet pcard" role="dialog" aria-label="Карточка товара">
    <button class="pclose" data-pclose aria-label="Закрыть">×</button>
    <div class="pimg" style="${tile(p)}"><img src="${imgOf(p)}" alt="${esc(tName(p))}" onerror="this.remove()"></div>

    ${rows.length?`<dl class="pinfo">${rows.map(r=>`<div><dt>${r[0]}</dt><dd>${esc(r[1])}</dd></div>`).join("")}</dl>`:""}
    ${live?`<div class="pbuy">${q?`<div class="pill-q" style="position:static;flex:none"><button data-dec="${p.id}" aria-label="Меньше">−</button><span>${q}</span><button data-add="${p.id}" aria-label="Больше">+</button></div><button class="btn" data-pclose>В корзине</button>`
       :`<button class="btn" data-add="${p.id}">Добавить в корзину · ${fmt(p.price)}</button>`}</div>`:""}

}
function renderProduct(){
  let bg=document.getElementById("pbg");
  const p = state.pid ? prod(state.pid) : null;
  if(!p){ if(bg) bg.remove(); document.body.style.overflow=""; return; }
  if(!bg){ bg=document.createElement("div"); bg.id="pbg"; bg.className="sheet-bg"; document.body.appendChild(bg); }
  const keep = bg.firstElementChild ? bg.firstElementChild.scrollTop : 0;
  bg.innerHTML=productSheet(p); document.body.style.overflow="hidden";
  if(bg.firstElementChild) bg.firstElementChild.scrollTop=keep;
  translateDom(bg);
}
function openProduct(id){ state.pid=id; renderProduct(); const c=document.querySelector("#pbg .pclose"); if(c) c.focus(); }
function closeProduct(){ state.pid=null; renderProduct(); }

/* ---------- кабинет лидера ---------- */
function leaderLink(z){
  const base=(SET.tg||"").trim();
  if(base) return base + "?startapp=" + encodeURIComponent(z.id);
  return location.origin + location.pathname + "?zk=" + encodeURIComponent(z.id);
}
function leaderBody(d){
  if(SET.prelaunch){
    if(state.tmpl==="morn") return `Соседи, скоро запускается Bereke store: продукты и товары для дома до 40% дешевле магазина. Они не тратят деньги на рекламу, а возвращают их покупателям. Я буду лидером нашего дома: заказы привезут мне, и вы заберёте их у меня. Запишитесь в список ожидания.`;
    return `Соседи, хотите платить за продукты, порошок, мыло и другие товары для дома до 40% меньше? Скоро запускается Bereke store, и я буду выдавать заказы в нашем доме. Запишитесь в список ожидания, чтобы получить доступ первыми.`;
  }
  const left = Math.max(0, d.threshold - d.pool);
  if(state.tmpl==="morn") return `Доброе утро, соседи! Сегодня до 21:00 собираем общий заказ Bereke store: продукты и товары для дома дешевле магазина. Наберём ${fmt(d.threshold)}, заказы привезут мне, и вы заберёте их у меня.`;
  return `Соседи, сбор Bereke store закрывается сегодня в 21:00. Набрано ${fmt(d.pool)} из ${fmt(d.threshold)}${left?`, осталось ${fmt(left)}.`:". Сбор набран!"} Как наберём, заказы привезут мне, и вы заберёте их у меня. Продукты и товары для дома по оптовым ценам.`;
}
const leaderText = d => leaderBody(d) + (SET.prelaunch ? " Записаться: " : " Заказать: ") + leaderLink(d.zk);

      <div class="linkrow"><span>${esc(leaderLink(z))}</span><button class="btn light" data-copy="${esc(leaderLink(z))}">Копировать</button></div>
      <div class="chips" role="group" aria-label="Готовые тексты">
        <button class="chip" data-tmpl="eve" aria-pressed="${state.tmpl==="eve"}">${SET.prelaunch?"Про цены":"Вечер"}</button>

      <div class="two"><button class="btn block" data-ext="https://t.me/share/url?url=${encodeURIComponent(leaderLink(z))}&text=${encodeURIComponent(leaderBody(d))}">В Telegram</button>

  } else if(state.ltab==="give"){

const VIEWS=["shop","cart","orders","how","leader"];
function render(){
  $("#zkName").textContent = zk().name;
  document.body.classList.toggle("prelaunch", !!SET.prelaunch);
  if(SET.prelaunch && ["cart","orders","done"].includes(state.view)) state.view="shop";
  let html;
  if(state.view==="done"&&state.done) html=viewDone(state.done);
  else html=({shop:viewShop,cart:viewCart,orders:viewOrders,how:viewHow,leader:viewLeader}[state.view]||viewShop)();
  $("#view").innerHTML=html;
  const nav=state.view==="done"?"orders":state.view;
  document.querySelectorAll(".nav button").forEach(b=>{ b.setAttribute("aria-current",b.dataset.go===nav?"page":"false"); if(b.dataset.pre!==undefined) b.hidden=!SET.prelaunch; if(b.dataset.live!==undefined) b.hidden=!!SET.prelaunch; });
  const lbl=document.querySelector('.nav [data-go="shop"] .lbl'); if(lbl) lbl.textContent = SET.prelaunch?"Главная":"Магазин";
  const c=cartCount(); const bd=$("#cartBadge"); bd.hidden=!c; bd.textContent=c;
  const cb=$("#cartBar"), showBar=c>0 && state.view==="shop" && !SET.prelaunch;
  cb.hidden=!showBar; document.body.classList.toggle("has-bar",showBar);
  if(showBar) cb.innerHTML=`<span class="cb-n">${c}</span><span class="cb-t">Корзина</span><b>${fmt(cartSum())}</b><svg viewBox="0 0 24 24" width="20" height="20"><path d="M9 6l6 6-6 6" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
  $("#deadline").hidden = state.view==="leader";
  translateDom(document.body);
  observeTips();
  if(state.pid) renderProduct();
  tgSync();
}
function go(v){
  state.view=v; if(location.hash!=="#"+v && v!=="done") history.replaceState(null,"",location.pathname+location.search+"#"+v);
  if(v==="leader" && state.leader && !state.ld) loadLeader();
  if(v==="orders") loadOrders();
  if(v==="shop"||v==="cart") loadPools();
  render(); window.scrollTo(0,0);
}

async function loadPools(){
  try{ const [p,s] = await Promise.all([rpc("adal_zk_pools",{}), rpc("adal_public_settings",{})]); POOLS=p||{}; SET={...SET,...(s||{})}; if(state.view==="shop"||state.view==="cart") { const keep=window.scrollY; render(); window.scrollTo(0,keep);} }catch(_){}
}
async function loadCatalog(){
  state.loading=true; state.loadError=null; render();
  try{
    const [zks, prods, set, pools] = await Promise.all([
      api("adal_zk?select=id,name,leader_name,flats,city&active=eq.true&order=name"),
      api("adal_products?select=id,cat,brand,name,name_kk,variant,weight,price,old_price,color,color2,image_url,composition,shelf,storage,descr&active=eq.true&order=sort"),
      rpc("adal_public_settings",{}).catch(()=>null), rpc("adal_zk_pools",{}).catch(()=>({}))
    ]);
    ZKS=zks; PRODUCTS=prods; POOLS=pools||{}; if(set) SET={...SET,...set};
    if(!ZKS.some(z=>z.id===state.zk) && ZKS[0]) state.zk=ZKS[0].id;
    for(const id of Object.keys(state.cart)) if(!prod(id)) delete state.cart[id];
    saveCart();
  }catch(e){ state.loadError=e.message; }
  state.loading=false; render();
}
async function loadOrders(){
  if(!state.orders.length) return;
  state.oLoading=true; render();
  await Promise.all(state.orders.map(async o=>{ try{ const d=await rpc("adal_order_status",{p_id:o.id,p_code:o.code}); if(d) state.ostat[o.id]=d; }catch(_){} }));
  state.oLoading=false; if(state.view==="orders") render();
}
async function loadLeader(){
  if(!state.leader) return;
  state.ldError=null;
  try{
    const d = await rpc("adal_leader_data",{p_zk:state.leader.zk, p_code:state.leader.code});
    if(d && d.error){ state.ld=null; state.ldError=d.error; if(/Неверный код/.test(d.error)){ state.leader=null; ss.del("adal-leader"); state.leaderMode="login"; toast(d.error); } }
    else state.ld=d;
  }catch(e){ state.ldError=e.message; }
  render();
}
async function leaderAction(action, order){
  state.busy=true; render();
  try{
    const r = await rpc("adal_leader_action",{p_zk:state.leader.zk, p_code:state.leader.code, p_action:action, p_order:order??null});
    if(r && r.error) toast(r.error);
    else { toast(action==="arrive"?"Отмечено: заказы привезли":"Заказ выдан"); if(action==="give") state.found=null; }
  }catch(e){ toast(e.message); }
  state.busy=false; await loadLeader();
}

/* ---------- события ---------- */
document.addEventListener("click",e=>{
  const a=e.target.closest("a[data-go]"); if(a){ e.preventDefault(); go(a.dataset.go); return; }
  if(e.target.id==="pbg"){ closeProduct(); return; }
  const t=e.target.closest("button");
  if(!t){ const o=e.target.closest("[data-open]"); if(o) openProduct(+o.dataset.open); return; }
  const d=t.dataset;
  if(d.pclose!==undefined){ closeProduct(); return; }
  if(d.lang!==undefined){ setLang(LANG==="kk"?"ru":"kk"); return; }
  if(d.qclear!==undefined){ state.q=""; render(); return; }
  if(d.go){ go(d.go); return; }
  if(d.add){ state.cart[d.add]=Math.min(50,(state.cart[d.add]||0)+1); saveCart(); render(); return; }
  if(d.dec){ state.cart[d.dec]--; if(state.cart[d.dec]<=0) delete state.cart[d.dec]; saveCart(); render(); return; }
  if(d.cat){ state.cat=d.cat; render(); return; }
  if(d.ltab){ state.ltab=d.ltab; state.found=null; state.foundErr=null; render(); return; }
  if(d.tmpl){ state.tmpl=d.tmpl; render(); return; }
  if(d.copy){ copyText(d.copy, "Скопировано"); return; }
  if(d.ext){ openExternal(d.ext); return; }
  if(d.give){ leaderAction("give", +d.give); return; }
  if(d.pay){ state.reg.pay=d.pay; document.querySelectorAll("[data-pay]").forEach(b=>b.setAttribute("aria-pressed",b.dataset.pay===d.pay)); return; }
  if(d.act==="reload"){ loadCatalog(); return; }
  if(d.act==="towait"){ const f=$("#waitForm"); if(f){ f.scrollIntoView({behavior:"smooth",block:"center"}); const i=$("#w-name"); if(i) setTimeout(()=>i.focus({preventScroll:true}),400); } return; }
  if(d.act==="becomeleader"){ state.leaderMode="reg"; state.regDone=false; go("leader"); return; }
  if(d.act==="tologin"){ state.leaderMode="login"; go("leader"); return; }
  if(d.act==="logout"){ state.leader=null; state.ld=null; state.ldError=null; state.found=null; ss.del("adal-leader"); state.leaderMode="login"; go("leader"); return; }
  if(d.act==="loadleader"){ loadLeader(); return; }
  if(d.act==="arrive"){ leaderAction("arrive"); return; }
  if(t.id==="zkBtn"){ openZk(); return; }
});

document.addEventListener("change",e=>{ if(e.target.id==="f-zk"){ state.zk=e.target.value; ss.set("adal-zk",state.zk); render(); } });

document.addEventListener("submit",async e=>{
  const id=e.target.id; if(!["checkout","regForm","loginForm","findForm","waitForm"].includes(id)) return;
  e.preventDefault(); if(state.busy) return;

  if(id==="waitForm"){
    const name=$("#w-name").value.trim(), phone=$("#w-phone").value.trim(), place=$("#w-place").value.trim(), err=$("#waitErr"), miss=[];
    if(name.length<2) miss.push("имя");
    if(phone.replace(/\D/g,"").length<10) miss.push("телефон");
    if(miss.length){ err.textContent="Укажите "+miss.join(" и ")+", чтобы мы могли сообщить о запуске."; err.hidden=false; return; }
    const u = TG && TG.initDataUnsafe && TG.initDataUnsafe.user;
    state.busy=true; render(); $("#w-name").value=name; $("#w-phone").value=phone; $("#w-place").value=place;
    try{
      const r = await rpc("adal_waitlist_join",{p:{name, phone, place, ref:state.ref, tg_id:u&&u.id, tg_username:u&&u.username}});
      CUST={...CUST, name, phone}; ss.set("adal-cust",CUST); state.wait={name}; ss.set("adal-wait",state.wait); SET.waiting=r.total;
      state.busy=false; render(); window.scrollTo(0,0);
    }catch(ex){ state.busy=false; render(); $("#w-name").value=name; $("#w-phone").value=phone; $("#w-place").value=place; const er=$("#waitErr"); er.textContent="Не получилось записать: "+ex.message; er.hidden=false; }
    return;
  }

  if(id==="checkout"){
    const v = k => $("#"+k).value.trim();
    const f = {zk:v("f-zk"), name:v("f-name"), apt:v("f-apt").replace(/^кв\.?\s*/i,""), phone:v("f-phone")};
    const err=$("#formErr"), miss=[];
    if(!f.name) miss.push("имя");
    if(!f.apt) miss.push("квартиру");
    if(f.phone.replace(/\D/g,"").length<10) miss.push("телефон");
    if(miss.length){ err.textContent="Укажите "+miss.join(", ")+", чтобы лидер знал, кому отдать заказ."; err.hidden=false; return; }
    state.zk=f.zk; ss.set("adal-zk",f.zk);
    const restore = () => { $("#f-name").value=f.name; $("#f-apt").value=f.apt; $("#f-phone").value=f.phone; };
    state.busy=true; render(); restore();
    try{
      const r = await rpc("adal_place_order",{p_zk:f.zk, p_name:f.name, p_apt:f.apt, p_phone:f.phone, p_items:state.cart});
      CUST={name:f.name, apt:f.apt, phone:f.phone}; ss.set("adal-cust",CUST);
      state.orders.unshift({id:r.id, code:r.code, zk:f.zk}); state.orders=state.orders.slice(0,20); ss.set("adal-orders",state.orders);
      POOLS[f.zk]=r.pool;
      state.done={...r, zk:f.zk};
      state.cart={}; saveCart(); state.busy=false; go("done");
    }catch(ex){
      state.busy=false; render(); restore();
      const er=$("#formErr"); er.textContent="Не получилось оформить заказ: "+ex.message; er.hidden=false;
    }
    return;
  }

  if(id==="loginForm"){
    const z=$("#l-zk").value, code=$("#l-code").value.trim(), err=$("#loginErr");
    if(!code){ err.textContent="Введите код доступа."; err.hidden=false; return; }
    state.busy=true; render();
    try{
      const d = await rpc("adal_leader_data",{p_zk:z, p_code:code});
      state.busy=false;
      if(d && d.error){ render(); $("#l-zk").value=z; const er=$("#loginErr"); er.textContent=d.error; er.hidden=false; return; }
      state.leader={zk:z, code}; ss.set("adal-leader", state.leader); state.ld=d; state.ltab="collect"; render();
    }catch(ex){ state.busy=false; render(); const er=$("#loginErr"); er.textContent=ex.message; er.hidden=false; }
    return;
  }

  if(id==="findForm"){
    const c=$("#oc").value.trim(); if(!c){ return; }
    state.busy=true; state.foundErr=null; state.found=null; render();
    try{
      const r = await rpc("adal_leader_find",{p_zk:state.leader.zk, p_code:state.leader.code, p_order_code:c});
      if(r && r.error) state.foundErr=r.error; else state.found=r.order;
    }catch(ex){ state.foundErr=ex.message; }
    state.busy=false; render(); return;
  }

  if(id==="regForm"){
    const r=state.reg, errs=[], bad=[];
    if(r.name.trim().length<2){ errs.push("имя"); bad.push("r-name"); }
    if(r.phone.replace(/\D/g,"").length<10){ errs.push("телефон (10–11 цифр)"); bad.push("r-phone"); }
    if(!r.zk.trim()){ errs.push("название ЖК"); bad.push("r-zk"); }
    const box=$("#regErr");
    bad.forEach(i=>$("#"+i).classList.add("bad"));
    if(errs.length){ box.textContent="Заполните: "+errs.join(", ")+"."; box.hidden=false; $("#"+bad[0]).focus(); return; }
    if(!r.agree){ box.textContent="Отметьте согласие с условиями, чтобы отправить заявку."; box.hidden=false; return; }
    state.busy=true; render();
    try{
      await rpc("adal_submit_application",{p:{...r, name:r.name.trim(), zk:r.zk.trim()}});
      state.busy=false; state.regDone=true; render(); window.scrollTo(0,0);
    }catch(ex){ state.busy=false; render(); const b=$("#regErr"); b.textContent="Не получилось отправить заявку: "+ex.message; b.hidden=false; }
  }
});

document.addEventListener("keydown",e=>{
  if(e.key==="Escape" && state.pid){ closeProduct(); return; }
  if((e.key==="Enter"||e.key===" ") && e.target.matches && e.target.matches(".tz[data-open]")){ e.preventDefault(); openProduct(+e.target.dataset.open); }
});
document.addEventListener("input",e=>{
  const t=e.target;
  if(t.id==="q"){ state.q=t.value; const g=$("#gridWrap"); if(g){ g.innerHTML=gridHtml(filterList()); translateDom(g); observeTips(); } return; }
  if(t.id==="calc"){ state.calc=+t.value; $("#calcN").textContent=t.value; $("#calcOut").textContent="≈ "+fmt(calcIncome(+t.value)); return; }
  if(t.dataset.reg){ state.reg[t.dataset.reg]= t.type==="checkbox" ? t.checked : t.value; t.classList.remove("bad"); }
});

function openZk(){
  if(!ZKS.length) return;
  const bg=document.createElement("div"); bg.className="sheet-bg";
  bg.innerHTML=`<div class="sheet" role="dialog" aria-label="Выбор ЖК"><h2>Ваш жилой комплекс</h2>
    <p class="muted" style="margin:0">Заказ заберёте у лидера выбранного ЖК.</p>
    ${ZKS.map(z=>`<button class="opt" data-zk="${esc(z.id)}" aria-pressed="${z.id===state.zk}"><span><b>${esc(z.name)}</b><br><span class="muted" style="font-size:13px">Лидер: ${esc(z.leader_name)}${z.flats?" · "+esc(z.flats):""}</span></span>${z.id===state.zk?"✓":""}</button>`).join("")}
    <button class="btn ghost block" data-close>Закрыть</button></div>`;
  bg.addEventListener("click",ev=>{
    const b=ev.target.closest("[data-zk]");
    if(b){ state.zk=b.dataset.zk; ss.set("adal-zk",state.zk); render(); bg.remove(); toast("ЖК выбран: "+zk().name); ev.stopPropagation(); return; }
    if(ev.target===bg||ev.target.closest("[data-close]")){ bg.remove(); ev.stopPropagation(); }
  });
  document.body.appendChild(bg); translateDom(bg); bg.querySelector(".opt").focus();
}

function tick(){
  const now=new Date(), end=new Date(now); end.setHours(21,0,0,0);
  if(now>=end) end.setDate(end.getDate()+1);
  const s=Math.floor((end-now)/1000), p=n=>String(n).padStart(2,"0");
  $("#cd").textContent=`${p(Math.floor(s/3600))}:${p(Math.floor(s%3600/60))}:${p(s%60)}`;
}
setInterval(tick,1000); tick();
setInterval(()=>{ if(!document.hidden && (state.view==="shop"||state.view==="cart") && !state.busy) loadPools(); }, 60000);

window.addEventListener("hashchange",()=>{ const h=location.hash.slice(1); if(VIEWS.includes(h) && h!==state.view) go(h); });
(function boot(){
  initTelegram();
  const q = new URLSearchParams(location.search).get("zk") || (TG && TG.initDataUnsafe && TG.initDataUnsafe.start_param) || "";
  if(/^[A-Za-z0-9_-]{1,40}$/.test(q)){ state.zk=q; state.ref=q; ss.set("adal-zk",q); ss.set("adal-ref",q); }
  else state.ref = ss.get("adal-ref") || "";
  const u = TG && TG.initDataUnsafe && TG.initDataUnsafe.user;
  if(u && !CUST.name && u.first_name) CUST={...CUST, name:u.first_name};
  const h=location.hash.slice(1); if(VIEWS.includes(h)) state.view=h;
  if(state.leader) state.leaderMode="login";
  loadCatalog().then(()=>{ if(state.view==="leader" && state.leader) loadLeader(); if(state.view==="orders") loadOrders(); });
})();
</script>

</body>
